## - Nose Wheel & Static Pressure ##


######### MAIN FLIGHT PANELS - UPPER ##########
## - AUTOPILOT FUNCTIONS ##
  - get: L:1:EHSI_1_COURSE
    set: "value > current ? '1 (>B:INSTRUMENT_COURSE_POINTER_LEFT_Inc)' : '1 (>B:INSTRUMENT_COURSE_POINTER_LEFT_Dec)'"
  - get: B:INSTRUMENT_HEADING_BUG_LEFT
    set: "value > current ? '1 (>B:INSTRUMENT_HEADING_BUG_LEFT_Inc)' : '1 (>B:INSTRUMENT_HEADING_BUG_LEFT_Dec)'"
