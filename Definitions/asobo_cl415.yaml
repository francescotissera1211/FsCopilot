  - get: B:WATER_DROP_DOOR_OPERATION_MODE
    set: |
      switch (value) {
        case 0: return '1 (>B:WATER_DROP_DOOR_OPERATION_MODE_SALVO)'
        case 1: return '0 (>B:WATER_DROP_DOOR_OPERATION_MODE_MANUAL_1)'
        case 2: return '2 (>B:WATER_DROP_DOOR_OPERATION_MODE_MANUAL_2)'
        case 3: return '3 (>B:WATER_DROP_DOOR_OPERATION_MODE_AUTO_2)'
        case 4: return '4 (>B:WATER_DROP_DOOR_OPERATION_MODE_AUTO_PAIR)'
        case 5: return '5 (>B:WATER_DROP_DOOR_OPERATION_MODE_AUTO_4)'
        default: return ''
      }
  - get: B:WATER_DROP_WATER_DISPLAY_SET
    set: (>B:WATER_DROP_WATER_DISPLAY_SET_Set)
  - get: B:WATER_DROP_DISPLAY_MODE
    set: |
      switch (value) {
        case 0: return '1 (>B:WATER_DROP_DISPLAY_MODE_NORM)'
        case 1: return '2 (>B:WATER_DROP_DISPLAY_MODE_AIRCRAFT_WEIGHT)'
        case 2: return '3 (>B:WATER_DROP_DISPLAY_MODE_DROPS)'
        case 3: return '4 (>B:WATER_DROP_DISPLAY_MODE_ZERO_FUEL_WEIGHT)'
        case 4: return '5 (>B:WATER_DROP_DISPLAY_MODE_INJ)'
        default: return ''
