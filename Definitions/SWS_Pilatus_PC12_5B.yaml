    set: "`1 ${value} (>K:2:HEADING_BUG_SET)`"

  - get: A:AUTOPILOT NAV1 LOCK, Bool
    set: (>K:AP_NAV1_HOLD)

  - get: A:AUTOPILOT APPROACH HOLD, Bool
    set: (>K:AP_APR_HOLD)

  # Half-bank button on the KMC321 panel uses the captured custom B-event.
  - get: A:AUTOPILOT MAX BANK ID, Number
    set: "`${value} (A:AUTOPILOT MAX BANK ID, Number) != if{ (>B:AUTOPILOT_Bank_Button_Toggle) }`"

  - get: A:AUTOPILOT BACKCOURSE HOLD, Bool
    set: (>K:AP_BC_HOLD)

  - get: A:AUTOPILOT FLIGHT LEVEL CHANGE, Bool
    set: (>K:FLIGHT_LEVEL_CHANGE)

  - get: A:AUTOPILOT AIRSPEED HOLD VAR, Knots
    set: "`${value} (>K:AP_SPD_VAR_SET)`"

  # AP test
  # Use the captured local test-active flag and the custom push event only.
  - get: L:KMC321_TEST_ACTIVE, Bool
    set: "`${value} (L:KMC321_TEST_ACTIVE, Bool) != if{ (>B:AUTOPILOT_TEST_1_Push) ${value} (>L:KMC321_TEST_ACTIVE, Bool) ${value} if{ 0 (>L:SWS_AUTOPILOT_1_TEST_COMPLETED, Bool) } }`"

  # Track the underlying AP targets so knob desync is easier to see in testing.
  - get: A:AUTOPILOT ALTITUDE LOCK VAR:1, Feet
  - get: A:AUTOPILOT VERTICAL HOLD VAR:1, Feet per minute

