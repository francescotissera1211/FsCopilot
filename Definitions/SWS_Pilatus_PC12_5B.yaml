# SWS Pilatus PC-12 - FS Copilot shared cockpit starter
# Revised from the user's last working YAML plus captured event notes.
# Notes for this revision:
# - BARO sync remains intentionally disabled because it is a known FS CoPilot knob desync issue and the community workaround is to let each pilot set BARO locally.
# - Added more position trackers and custom-event fallbacks for the remaining trouble spots: flaps, gear, condition lever animation, KAS297 knobs, probe heat, AP test, and TOGA.
# - Prefer direct A:/L: state tracking and pulse the captured cockpit event when state differs.
# - If any item double-toggles in testing, comment that entry out and keep the tracking helper only.

master:
  # ---------- PRIMARY FLIGHT CONTROLS / TRIM ----------
  - get: A:AILERON TRIM PCT, Percent
    set: (>K:AILERON_TRIM_SET_EX1)

  - get: A:ELEVATOR TRIM PCT, Percent
    set: (>K:ELEVATOR_TRIM_SET)

  - get: A:RUDDER TRIM PCT, Percent
    set: (>K:RUDDER_TRIM_SET)

  # Trim animation helper / indicator
  - get: L:HANDLING_AILERON_ELEVATOR_Trim_Position, Number

  # ---------- CONTROL COLUMN / PEDALS (ANIMATION SYNC) ----------
  - get: A:YOKE X POSITION, Percent over 100
  - get: A:YOKE Y POSITION, Percent over 100
  - get: A:RUDDER POSITION, Percent

  # ---------- ENGINE CORE ----------
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k
    set: (>K:THROTTLE1_SET)

  # Condition lever: PF-only control is acceptable, but we now also push the captured custom events so the monitoring side animation has a better chance to follow the detents.
  # Captured mapping from your notes:
  # 0 = cutoff, 1 = ground idle, 2 = flight idle.
  - get: L:ENGINE_Lever_Condition_1, Number
    set: "value == 0 ? '0 (>A:GENERAL ENG MIXTURE LEVER POSITION:1, Percent over 100) 0 (>L:ENGINE_Lever_Condition_1) (>B:FUEL_1_Condition_Lever_Cut_Off)' : value == 1 ? '0.01 (>A:GENERAL ENG MIXTURE LEVER POSITION:1, Percent over 100) 1 (>L:ENGINE_Lever_Condition_1) (>B:FUEL_1_Condition_Lever_Low_Idle)' : '1 (>A:GENERAL ENG MIXTURE LEVER POSITION:1, Percent over 100) 2 (>L:ENGINE_Lever_Condition_1) (>B:FUEL_1_Condition_Lever_High_Idle)'"

  # Position helpers for debugging / animation tracking
  - get: A:GENERAL ENG MIXTURE LEVER POSITION:1, Percent over 100
  - get: L:ENGINE_Lever_Condition_1, Number
  - get: A:GENERAL ENG FUEL VALVE:1, Bool

  - get: A:GENERAL ENG STARTER:1, Bool
    set: (>K:TOGGLE_STARTER1)

  - get: L:ENGINE_Push_Ignition_1, Bool
    set: "`${value} (>L:ENGINE_Push_Ignition_1, Bool)`"

  - get: A:GENERAL ENG PROPELLER LEVER POSITION:1, Percent

  # ---------- PARKING BRAKE ----------
  # Parking brake only in master. Flaps and gear are kept out of master for this pass.
  - get: A:BRAKE PARKING POSITION, Bool
    set: (>K:PARKING_BRAKE_SET)

# #### AUTOTHROTTLE TO GA #### I recommend thsi being inthe Master area
  - get: L:WT_TOGA_ACTIVE, Bool
    set: (>K:AUTO_THROTTLE_TO_GA)

