master:
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, Position 16k
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, Position 16k
  - get: B:ENGINE_Propeller_1, Number
    set: (>B:ENGINE_Propeller_1_Set)
  - get: B:ENGINE_Propeller_2, Number
    set: (>B:ENGINE_Propeller_2_Set)
  - get: B:FUEL_MIXTURE_1, Number
    set: (>B:FUEL_MIXTURE_1_Set)
  - get: B:FUEL_MIXTURE_2
    set: (>B:FUEL_MIXTURE_2_Set)
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  - get: L:HANDLING_ElevatorTrim, Number # TRIM
    set: (>K:ELEVATOR_TRIM_SET)
  - get: A:AILERON TRIM PCT, percent scaler 16k # TRIM
    set: (>K:AILERON_TRIM_SET_EX1)
  - get: A:RUDDER TRIM PCT, percent scaler 16k # TRIM
    set: (>K:RUDDER_TRIM_SET_EX1)
  - get: L:ADI_GA_BUTTON, Bool # ADI GA BUTTON
    set: (>K:AUTO_THROTTLE_TO_GA)
  - get: A:FLAPS HANDLE INDEX, Number # FLAPS
    set: |
      switch (value) {
          case  0: return '0 (>K:FLAPS_CONTINUOUS_SET)'
          case  1: return '5461 (>K:FLAPS_CONTINUOUS_SET)'
          case  2: return '10922 (>K:FLAPS_CONTINUOUS_SET)'
          case  3: return '16383 (>K:FLAPS_CONTINUOUS_SET)'
          default: return ''
      }
      
