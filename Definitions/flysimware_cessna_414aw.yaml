# KNOWN ISSUES:
# You must have all of the modules installed to use this profile (include:)
 # EFB Items 
    # - 1. EFB PREFLIGHT PAGE IS GLITCHY, Do not use
    # - 2. EFB OPTIONS PAGE - ALL FUNCTIONS are working except (Double Click on elements is necessary until a fix from Yury):
      # - Do Not Use READY to FLY or START Engine option
      # - TIE Downs and STATIC WICKS are NON OPERATIONAL
    # - 3. EFB WEIGHT and BALANCE/FUEL page non OPERATIONAL
    # - 4. EFB LUGGAGE and PAX options work
 # - The TDS GTN750 NXi is only synched on external buttons and knobs. Their mouse clicks are hidden, not synchable and messages from tem say it is impossible to synch. This is not recommented to use. 
 # - KNOB Rotation has isues on Course knob so turn slowly or mouseclick and hold on left or right side of the knob and this will keep them in sync. If you have accelleration on SpadNext or other controls, they will not synch unless you disable accelleration. 

