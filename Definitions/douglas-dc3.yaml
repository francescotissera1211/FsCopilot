# Microsoft / Aeroplane Heaven Douglas DC-3 (MSFS 2024 default) - FsCopilot profile
# Version: 0.1.0  (2026-10-11)
#
#   This profile has been tested extensively on MSFS 2024 ONLY for both the classic AND retrofitted versions of the aircraft, there are currently no blaring issues.
#   If you find any issues please report via Discord. Enjoy the Doug :)
# 

include:
  - modules/AS_GNS530.yaml
  - modules/AS_GNS430.yaml
  - modules/fuel.yaml
  - modules/payload.yaml

master:
  # ---- Engine levers (pedestal quadrant) ----------------------------------------
  - get: B:ENGINE_THROTTLE_1, Number
    set: (>B:ENGINE_THROTTLE_1_Set)
  - get: B:ENGINE_THROTTLE_2, Number
    set: (>B:ENGINE_THROTTLE_2_Set)
  - get: B:ENGINE_PROPELLER_1, Number
    set: (>B:ENGINE_PROPELLER_1_Set)
  - get: B:ENGINE_PROPELLER_2, Number
    set: (>B:ENGINE_PROPELLER_2_Set)
  - get: B:FUEL_MIXTURE_1, Number
    set: (>B:FUEL_MIXTURE_1_Set)
  - get: B:FUEL_MIXTURE_2, Number
    set: (>B:FUEL_MIXTURE_2_Set)
  # ---- Brakes --------------------------------------------------------------------
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  # ---- Trim wheels / knobs (0-100 scale on this aircraft) ------------------------
  - get: B:HANDLING_ELEVATORTRIM_1, Number
    set: (>B:HANDLING_ELEVATORTRIM_1_Set)
  - get: B:HANDLING_AILERONSTRIM_1, Number
    set: (>B:HANDLING_AILERONSTRIM_1_Set)
  - get: B:HANDLING_RUDDERTRIM_1, Number
    set: (>B:HANDLING_RUDDERTRIM_1_Set)
  # ---- Flaps (9 handle positions, hydraulic) -------------------------------------
  - get: A:FLAPS HANDLE INDEX, Number
  # ---- Tailwheel lock ------------------------------------------------------------
  - get: B:INSTRUMENT_AH_TAILWHEEL_LOCK, Number
    set: (>B:INSTRUMENT_AH_TAILWHEEL_LOCK_Set)

