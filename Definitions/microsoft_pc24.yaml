# Microsoft Pilatus PC24 variant - FsCopilot YAML Configuration
# Version: 0.0.1
# Created By: DKgolfnut
# Special Thanks: 
# Date: 8/16/2026 

# Known Issues:
  # - Initial release all functions working. 
  # - 8/22/2026
   # - STROBE/BEACON LIGHT SWITCH will not synch, I have tried numerous ways to solve this but have not been successful.
   # - PFD CONTROL FUNCTIONS that have more than 2 positions will not synch. I have raised this to Yuri for a potential issue with his core program. *** The functions are NAV SEL, NAV PREVIEW, SINGLE and DOUBLE COURSE needles. ***
   # - SIMBRIEF works through MSFS2024 TABLET IMPORT for FUEL and FP prior to entering into Flight. EACH PILOT MUST do this prior to entering flight and joining the FSC session. 

# FIXED:
  # - 8/16/2026
   # - 

include:
  - modules/fuel.yaml
  - modules/payload.yaml
  - modules/radios.yaml
  - modules/transponder.yaml
master: 
  - get: A:AILERON TRIM PCT, Percent over 100 # AILERON TRIM
  - get: A:ELEVATOR TRIM PCT, Position 16k
    set: (>K:ELEVATOR_TRIM_SET)
  - get: B:HANDLING_ELEVATORTRIM_YOKE
  - get: A:RUDDER TRIM PCT, Position 16k
    
  - get: L:HANDLING_RudderTrim
    set: (>K:RUDDER_TRIM_SET_EX1)
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER
    set: (>K:THROTTLE1_SET)
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, position 16k # Throttle 1 LEVER
    set: (>K:THROTTLE2_SET)

  - get: B:ENGINE_THROTTLE_1
  - get: B:ENGINE_THROTTLE_2

  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
shared:
######### Example #########
  - get: A:FUEL TANK SELECTOR:1, Enum
    set: |
      switch (value) {
        case 0: return '(>K:FUEL_SELECTOR_OFF)'
        case 1: return '(>K:FUEL_SELECTOR_ALL)'        
        case 19: return '(>K:FUEL_SELECTOR_LEFT_MAIN)'
        case 20: return '(>K:FUEL_SELECTOR_RIGHT_MAIN)'
        default: return ''
      }  

