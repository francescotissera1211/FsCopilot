# FS Copilot - glass displays whose pointer and input are shared between the pilots.
#
# Identification deliberately does NOT use the panel name ("VCockpit53"): the simulator renumbers
# panels between sessions and when other add-ons patch the panel configuration. A display is
# identified by:
#
#   gauge:  the Wasm gauge name of the display (e.g. "DU" for the A380 display units)
#   order:  its position inside that gauge group (1 = first). The simulator numbers panels globally
#           and that absolute number moves between sessions (VCockpit52..60 became VCockpit29..37 in
#           the next session), but the order inside a group stays the same - the two sessions above
#           resolve "DU#2" to the very same display. That key (gauge#order) is what travels between
#           the two pilots, each side maps it to its own panel.
#   match:  substring of the screen address / title / details (panel name, gauge, ...) - fallback
#   guid:   instrument GUID reported by the simulator - informational, may change
#
# The Develop window lists every display with its group, its derived number ("#2") and the
# addresses, so the numbers below can be verified/corrected in a few seconds: select a row and use
# "Peer click" - the display that reacts is the one that row points at.

# - aircraft: substring of the aircraft name reported by the simulator
#   clicks:   share mouseup/click of these displays with the other pilot.
#             Default false: the pointer position and the press (mousedown) are shared, but mouseup
#             and the click that follows are generated by the simulator itself.
#   screens:
#     - name:  label used in the logs and on the remote pointer
#       gauge / order / match / guid: see above

- aircraft: inibuilds-a380
  clicks: false
  screens:
    - { name: ND CPT,  gauge: DU, order: 2 }
    - { name: ND FO,   gauge: DU, order: 4 }
    - { name: SD,      gauge: DU, order: 6 }
    - { name: MFD CPT, gauge: DU, order: 7 }
    - { name: MFD FO,  gauge: DU, order: 8 }
