# AEROSOFT CRJ-700 - FsCopilot YAML Configuration
# Version: 0.0.1
# Date: 4/12/2026
# KNOWN ISSUES:
# - ENGINE START SWITCHES - Make sure you HOLD each btn for 2-3 seconds as they need long clicks to initiate the correct start sequence. 

#  - KNOB DESYNC WHEN KNOBS are rotated quickly. (SPD,HDG,ALT,DH, MDA, VSPDS, ETC) Please turn slowly. 
     # - On Heading, you can use the PF to turn the heading knob and once on that heading , hit the sync BTN and the PM's heading will sync. 
     # - Similar on IAS Speeds PF sets speed and once up to that speed, hit IAS BTN once to set MACH, then again to sync to IAS SPEED to current flight speed. a little quirky but this works
    # - ALT Is being removed due to Sync issues
#  - NO SYNC on EFB due to no exposed VARS. Both Pilots must set up import from Simbrief using the EFB IMPORT OFP BTN using same Pilot ID (Set up in OPTIONS) and use the Send to FMS for FLTPLAN and Set Payload & Fuel on both pilots EFB's. Manual entry of all options inthe MCDU/FMS sync well.  

#  - Many button clicks work and are animated where others have no animation logic so they will not move. Example is the Engine Start switches. They sync but long click isnt see on the PM but illuminated messages do sync. 

# - I did not test GSX, but pushback works fine from what I can see.

# Fixed:
   # - 4/12/2026 
     # - Yury Updated Syntax for :1 showing before argument and K:2: logic 
     # Published copying 900 profile
   # - 3-27-2026
     # - Removed Altitude knob sync due to issues with Desyncing.

