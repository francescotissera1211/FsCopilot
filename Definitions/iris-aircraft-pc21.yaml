#  - modules/AS_GNS430.yaml
#  - modules/AS_GNS530.yaml
  - modules/fuel.yaml
  - modules/payload.yaml

master: 
  - get: A:AILERON TRIM PCT, Percent over 100 # AILERON TRIM

  - get: A:ELEVATOR TRIM PCT, Percent over 100 # ELEVATOR TRIM
    set: "value > current ? '(>K:ELEV_TRIM_UP)' : '(>K:ELEV_TRIM_DN)'"
  - get: A:ELEVATOR TRIM INDICATOR, radians

  - get: A:RUDDER TRIM PCT, Percent # RUDDER TRIM BTN
    set: (>K:RUDDER_TRIM_SET) 
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER

  - get: A:GENERAL ENG PROPELLER LEVER POSITION:1, position 16k # PROPELLER 1 LEVER
    set: (>K:PROP_PITCH1_SET)
  - get: A:GENERAL ENG MIXTURE LEVER POSITION:1, position 16k # - MIXTURE 1 LEVER 
  - get: L:BKSQ_MixtureLeverPosition_1, Percent 
  - get: L:BKSQ_TurboCharged, Bool
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
 # - # FLAP Levers
  - get: A:FLAPS HANDLE PERCENT, Percent
  - get: A:FLAPS HANDLE INDEX, Number
    set: |
      switch (value) {
        case 0: return '(>K:FLAPS_UP)'
        case 1: return '(>K:FLAPS_1)'
        case 2: return '(>K:FLAPS_2)'
        default: return ''  
      }
  
# - # Condition Lever
  - get: L:Condition_Lever_CutOff_1
  - get: B:FUEL_1_Condition_Lever, Number 
    set: |  
      switch (value) {
          case 0: return '(>B:FUEL_1_Condition_Lever_High_Idle)' 
          case 1: return '(>B:FUEL_1_Condition_Lever_Low_Idle)'  
          case 2: return '(>B:FUEL_1_Condition_Lever_Cut_Off)' 
          default: return ''
      }     
  - get: A:GENERAL ENG FUEL VALVE:1, Bool
    set: (>K:SET_FUEL_VALVE_ENG1)
    
shared:
#  - ## SPOILER HIDDEN KEY ##
  - get: A:SPOILERS HANDLE POSITION
    set: 0 (>K:SPOILERS_TOGGLE)
#  - ## AUTOPILOT PANEL ##
  - get: A:AUTOPILOT MASTER
    set: |
      switch (value) {
        case 1: return '(>K:AUTOPILOT_ON)'
        case 0: return '(>K:AUTOPILOT_OFF)'
        default: return ''
      }
  - get: A:AUTOPILOT FLIGHT DIRECTOR ACTIVE, Bool
    set: (>K:TOGGLE_FLIGHT_DIRECTOR)

  - get: A:AUTOPILOT HEADING LOCK,Bool
    set: (>K:AP_PANEL_HEADING_HOLD)
  - get: A:AUTOPILOT HEADING LOCK DIR:1, Degrees
    set: (>K:2:HEADING_BUG_SET)
  - get: A:AUTOPILOT NAV1 LOCK, Bool
    set: |
      switch (value) {
        case 0: return '(>K:AP_NAV1_HOLD_OFF)'
        case 1: return '(>K:AP_NAV1_HOLD_ON)'
        default: return ''
      }    
  - get: A:AUTOPILOT PITCH HOLD, Bool
  - get: A:AUTOPILOT APPROACH HOLD
    set: |
      switch (value) {
        case 0: return '(>K:AP_APR_HOLD_OFF)'
        case 1: return '(>K:AP_APR_HOLD_ON)'
        default: return ''
      }

  - get: A:AUTOPILOT VERTICAL HOLD
    set: |
      switch (value) {
        case 0: return '(>K:AP_PANEL_VS_OFF)'
        case 1: return '(>K:AP_PANEL_VS_ON)'
        default: return ''
      }

  - get: A:AUTOPILOT ALTITUDE LOCK, Bool
    set: (>K:AP_ALT_VAR_SET_ENGLISH)

  - get: A:AUTOPILOT ALTITUDE LOCK, Bool
    set: |
      switch (value) {
        case 0: return '(>K:AP_ALT_HOLD_OFF)'
        case 1: return '(>K:AP_ALT_HOLD_ON)'
        default: return ''
      }

  - get: A:AUTOPILOT AIRSPEED HOLD, Bool
    set: (>K:AP_SPD_VAR_SET)

  - get:  A:AUTOPILOT THROTTLE ARM, Bool
    set: (>K:AUTO_THROTTLE_ARM)

  - get: A:GPS DRIVES NAV1
    set: (>K:TOGGLE_GPS_DRIVES_NAV1)

#  - ## Not sure if this is needed
