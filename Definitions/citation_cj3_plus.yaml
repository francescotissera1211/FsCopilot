# LivToAir Cessna CJ3+ variant - FsCopilot YAML Configuration
# Version: 0.0.1
# Created By: Dkgolfnut
# Special Thanks: 
# Date: 9/4/2026 

# Known Issues:
# - Initial release all functions working with exception of those noted below.  
  # - 9/4/2026
   # - DO NOT USE DISCO MODE LIGHTING, it seems to always operate opposite way. If you do and the color changes drive you crazy, disconnect PNF from FSC set both Disco settings to Off and reconnect FSC. 
   # - You Must Disconnect FSC prior to entering in ICAO for Navigraph Charts with onboard EFB, then reconnect FSC. For some reason the Keyboard operation toggles and it will work for one and not the other.  Synchronization of Simbrief and Navigraph work great with that one exception. 
   # - AS_G3000 module all functions work, except the "USE RAT" option in Initialization >> TakeOff Data >> Weather Tab and Initialization >> TakeOff Data >> Accept TakeOff Speeds option. BOTH PILOTS MUST SELECT THESE OPTIONS MANUALLY. There are Odd behaviors from touchscreens that I have no control over. **** Hitting the HOME BTN **** will get the both Pilots back to the correct page sync so communicate with each other about what you are seeing. 
   # - This profile requires the AS_G3000 module to be installed. I have created it and it should download automatically when FSC sees this aircraft.

# FIXED:
  # - 9/4/2026
   # - Original release today 9/4/2026

include:
  - modules/AS_G3000.yaml
  - modules/fuel.yaml
  - modules/payload.yaml
  - modules/transponder.yaml
master: 
  - get: L:XMLVAR_AileronsTrim_Switch_1  
  - get: A:AILERON TRIM PCT, Percent over 100 # AILERON TRIM
  - get: A:ELEVATOR TRIM PCT, Position 16k
    set: (>K:ELEVATOR_TRIM_SET)
  - get: L:XMLVAR_ElevatorTrim_Switch_1  
  - get: B:HANDLING_ELEVATORTRIM_YOKE
  - get: L:XMLVAR_RudderTrim_Switch_1  
  - get: A:RUDDER TRIM PCT, Position 16k
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER
    set: (>K:THROTTLE1_SET)
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, position 16k # Throttle 1 LEVER
    set: (>K:THROTTLE2_SET)
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:1, position 16k # Throttle 1 LEVER
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:2, position 16k # Throttle 1 LEVER  
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  - get: A:FLAPS HANDLE INDEX, Number

shared:
#############  MAIN PANELS - Front Lower #############
## ELECTRICAL POWER PANEL ##
  - get: B:ELECTRICAL_Alternator_1
    set: |
      switch (value) {
        case 0: return '(>B:ELECTRICAL_Alternator_1_On)'
        case 1: return '(>B:ELECTRICAL_Alternator_1_Off)'
        case 2: return '(>B:ELECTRICAL_Alternator_1_Reset)'
        default: return ''        
      }
  - get: B:ELECTRICAL_Alternator_2
    set: |
      switch (value) {
        case 0: return '(>B:ELECTRICAL_Alternator_2_On)'
        case 1: return '(>B:ELECTRICAL_Alternator_2_Off)'
        case 2: return '(>B:ELECTRICAL_Alternator_2_Reset)'
        default: return ''        
      }
  - get: B:ELECTRICAL_Battery_1
    set: |
      switch (value) {
        case 0: return '(>B:ELECTRICAL_Battery_1_On)'
        case 1: return '(>B:ELECTRICAL_Battery_1_Off)'
        case 2: return '(>B:ELECTRICAL_Battery_1_Emergency)'
        default: return ''        
      }
  - get: L:ELECTRICAL_Switch_emerLights
  - get: L:STBY_FLY_DISPLAY_Switch
  - get: L:Dispatch_Switch
## ICE PROTECTION SWITCHES ##
  - get: L:Switch_Xflow
  - get: L:Switch_L_Deice
  - get: L:Switch_R_Deice
  - get: L:Switch_Tail_Deice

## ICE PROTECTION WINDOWS SWITCHES ##
  - get: L:Switch_Bleed_Windshield
  - get: L:Windshield_Deice_Power
  - get: L:Knob_Bleed_Windshield_Left
  - get: L:Knob_Bleed_Windshield_Right
  - get: L:Switch_Alcohol_Windshield
  - get: L:Windshield_Alcohol_Power, Bool

## PRESSURIZATTION SWITCHES ##
  - get: L:Pressurization_AirSource_Knob
  - get: L:Pressurization_Switch, Bool
  - get: L:Pressurization_Dump_Cover
  - get: L:Pressurization_Dump_Switch
## FUEL BOOST and TRANSFER PANEL SWITCHES ##
