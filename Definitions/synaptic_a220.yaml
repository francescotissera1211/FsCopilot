    set: (>B:AIRLINER_CCP_MENU_1_Set)
  - get: H:A220_CCP_MENU_2
    set: (>B:AIRLINER_CCP_MENU_2_Set)

  # ── Audio Control Panel ───────────────────────────────────────────────────

  - get: L:A22X Tx Channel, Number
    set: |
      switch (value) {
          case 0: return '0 (>B:AIRLINER_ACP_PUSH_VHF1_1_Set) 0 (>B:AIRLINER_ACP_PUSH_VHF2_1_Set) 0 (>B:AIRLINER_ACP_PUSH_VHF3_1_Set)'
          case 1: return '1 (>B:AIRLINER_ACP_PUSH_VHF1_1_Set)'
          case 2: return '1 (>B:AIRLINER_ACP_PUSH_VHF2_1_Set)'
          case 3: return '1 (>B:AIRLINER_ACP_PUSH_VHF3_1_Set)'
          default: return ''
      }

  - get: L:A22X ACP VHF1 Volume
  - get: L:A22X ACP VHF2 Volume
  - get: L:A22X ACP VHF3 Volume

