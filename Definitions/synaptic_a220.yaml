  - get: H:A220_KBD_NEXT_2
    set: (>B:AIRLINER_KBD_NEXT_2_Set)
  - get: H:A220_KBD_CAS_1
    set: (>B:AIRLINER_KBD_CAS_1_Set)
  - get: H:A220_KBD_CAS_2
    set: (>B:AIRLINER_KBD_CAS_2_Set)

