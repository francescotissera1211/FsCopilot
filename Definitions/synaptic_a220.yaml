  - get: L:A22X Pilot Event

  # ── Spoilers & Flaps ──────────────────────────────────────────────────────

  - get: L:A22X Spoiler Lever
    set: "`${Math.round(value * 32766 - 16383)} (>K:AXIS_SPOILER_SET)`"

  - get: A:FLAPS HANDLE PERCENT
    set: "`${Math.round(value * 32766 - 16383)} (>K:AXIS_FLAPS_SET)`"

  # ── Lights & Brightness ───────────────────────────────────────────────────

  - get: L:A22X Lower Brightness
  - get: L:A22X ISI Brightness

  - get: L:A22X Pedestal Integral Lights
  - get: L:A22X Glareshield Integral Lights

  - get: L:A22X Flood Lights

  - get: L:A22X DU1 Backlight
  - get: L:A22X DU2 Backlight
  - get: L:A22X DU3 Backlight
  - get: L:A22X DU4 Backlight
  - get: L:A22X DU5 Backlight
  - get: L:A22X L MKP Brightness
  - get: L:A22X R MKP Brightness
  - get: L:A22X L CTP Backlight
  - get: L:A22X R CTP Backlight
  - get: L:A22X FCP Backlight
  - get: L:A22X Annun Brightness

  # ── Cockpit Door ──────────────────────────────────────────────────────────

  - get: L:A22X Cockpit Door Unlock
    set: "`${!!value !== !!current ? '(>B:AIRLINER_COCKPIT_DOOR_UNLOCK_Set)' : ''}`"
  - get: L:A22X Cockpit Door Open
  - get: L:A22X Aural Cockpit Door

  - get: L:A22X Emer Access
    set: "`${!!value !== !!current ? '(>B:AIRLINER_EMER_ACCESS_Set)' : ''}`"

  # ═══ CIRCUIT BREAKERS ═════════════════════════════════════════════════════

