  - get: H:A220_DSK_LARGE_1_DEC
    set: (>B:AIRLINER_DSK_KNOB_LARGE_1_Set)
  - get: H:A220_DSK_LARGE_2_DEC
    set: (>B:AIRLINER_DSK_KNOB_LARGE_2_Set)
  - get: H:A220_DSK_SMALL_1_DEC
    set: (>B:AIRLINER_DSK_KNOB_SMALL_1_Set)
  - get: H:A220_DSK_SMALL_2_DEC
    set: (>B:AIRLINER_DSK_KNOB_SMALL_2_Set)

