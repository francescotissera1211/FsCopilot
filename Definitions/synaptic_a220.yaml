  - get: H:A220_KBD_CHKL_2
    set: (>B:AIRLINER_KBD_CHKL_2_Set)
  - get: H:A220_KBD_SYN_1
    set: (>B:AIRLINER_KBD_SYN_1_Set)
  - get: H:A220_KBD_SYN_2
    set: (>B:AIRLINER_KBD_SYN_2_Set)
  - get: H:A220_KBD_DATA_1
    set: (>B:AIRLINER_KBD_DATA_1_Set)
  - get: H:A220_KBD_DATA_2
    set: (>B:AIRLINER_KBD_DATA_2_Set)

