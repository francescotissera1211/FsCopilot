  - get: L:A22X L ADS Reversion, Number
    set: (>B:AIRLINER_RSP_L_PFD_ADS_Set)
  - get: L:A22X R ADS Reversion
    set: (>B:AIRLINER_RSP_R_PFD_ADS_Set)

