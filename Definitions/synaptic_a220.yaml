    set: (>B:AIRLINER_KBD_LEFT_1_Set)
  - get: H:A220_KBD_LEFT_2
    set: (>B:AIRLINER_KBD_LEFT_2_Set)
  - get: H:A220_KBD_RIGHT_1
    set: (>B:AIRLINER_KBD_RIGHT_1_Set)
  - get: H:A220_KBD_RIGHT_2
    set: (>B:AIRLINER_KBD_RIGHT_2_Set)
  - get: H:A220_KBD_UP_1
    set: (>B:AIRLINER_KBD_UP_1_Set)
  - get: H:A220_KBD_UP_2
    set: (>B:AIRLINER_KBD_UP_2_Set)
