  - get: L:A22X Reversion Mode

  - get: H:A220_RSP_INHIB_L
    set: (>B:AIRLINER_RSP_INHIB_L_Set)
  - get: H:A220_RSP_INHIB_R
    set: (>B:AIRLINER_RSP_INHIB_R_Set)

  - get: L:A22X Display Tune Inhibited, Number
    set: "!!value !== !!current ? '1 (>B:AIRLINER_RSP_INHIB_Set)' : ''"

  - get: H:A220_RSP_ALTN # TODO: HTML event's existence unconfirmed.
