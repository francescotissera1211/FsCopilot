  # ── Punctuation ───────────────────────────────────────────────────────────
  # Panel legends SP, /, . and +/-.
  - get: H:A220_KBD_SPACE_1
    set: (>B:AIRLINER_KBD_SPACE_1_Set)
  - get: H:A220_KBD_SPACE_2
    set: (>B:AIRLINER_KBD_SPACE_2_Set)
  - get: H:A220_KBD_SLASH_1
    set: (>B:AIRLINER_KBD_SLASH_1_Set)
  - get: H:A220_KBD_SLASH_2
    set: (>B:AIRLINER_KBD_SLASH_2_Set)
  - get: H:A220_KBD_DOT_1
    set: (>B:AIRLINER_KBD_DOT_1_Set)
  - get: H:A220_KBD_DOT_2
    set: (>B:AIRLINER_KBD_DOT_2_Set)
  - get: H:A220_KBD_PLUS_MINUS_1
    set: (>B:AIRLINER_KBD_PLUS_MINUS_1_Set)
  - get: H:A220_KBD_PLUS_MINUS_2
    set: (>B:AIRLINER_KBD_PLUS_MINUS_2_Set)

  # ── Clear and enter ───────────────────────────────────────────────────────
  # CLR/DEL is the only held key on the panel: the mouse writes 1 on press and 0 on
  # release, but the input event's _Set only ever writes the 1. A relayed press is
  # therefore always a tap on the receiving side -- a long hold does not carry across.
  - get: H:A220_KBD_CLEAR_1
    set: (>B:AIRLINER_KBD_CLEAR_1_Set)
  - get: H:A220_KBD_CLEAR_2
    set: (>B:AIRLINER_KBD_CLEAR_2_Set)
  - get: H:A220_KBD_ENTER_1
    set: (>B:AIRLINER_KBD_ENTER_1_Set)
  - get: H:A220_KBD_ENTER_2
    set: (>B:AIRLINER_KBD_ENTER_2_Set)

  # ── Page and mode keys ────────────────────────────────────────────────────
  - get: H:A220_KBD_MAP_1
    set: (>B:AIRLINER_KBD_MAP_1_Set)
  - get: H:A220_KBD_MAP_2
    set: (>B:AIRLINER_KBD_MAP_2_Set)
  - get: H:A220_KBD_FMS_1
    set: (>B:AIRLINER_KBD_FMS_1_Set)
  - get: H:A220_KBD_FMS_2
    set: (>B:AIRLINER_KBD_FMS_2_Set)
