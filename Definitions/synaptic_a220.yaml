# Synaptic Simulations A220-300.
# Authors: AlexdAviator, xip
# Version: 0.0.1
# Updated: 2026-09-09

include:
  - modules/payload.yaml
  - modules/fuel.yaml
  # Uncomment to sync GSX ground services (boarding, fuelling, pushback, doors).
  # Both pilots need GSX installed. Harmless to leave off if only one of you runs it.
  # - modules/FSDT_GSX.yaml

pointer:
  - DisplayUnits

master:
  # ═══ THRUST LEVERS ════════════════════════════════════════════════════════

  - get: L:A22X Throttle L Raw
    set: "`${Math.round(value * 16383)} (>K:THROTTLE1_SET)`"
  - get: L:A22X Throttle R Raw
    set: "`${Math.round(value * 16383)} (>K:THROTTLE2_SET)`"
  - get: L:A22X Horizontal Stabilizer

  - get: A:RUDDER TRIM PCT, Percent

  # ── Sidestick and pedal animation ─────────────────────────────────────────
  - get: L:A22X L Sidestick X
  - get: L:A22X L Sidestick Y
  - get: L:A22X R Sidestick X
  - get: L:A22X R Sidestick Y

  # ── Wheel braking ─────────────────────────────────────────────────────────
  - get: A:BRAKE LEFT POSITION, Position
  - get: A:BRAKE RIGHT POSITION, Position

shared:
  # ═══ GLARESHIELD ══════════════════════════════════════════════════════════

  - get: L:A22X L Outboard Brightness
  - get: L:A22X L Inboard Brightness
  - get: L:A22X R Inboard Brightness
  - get: L:A22X R Outboard Brightness

  # ── Master Caution ────────────────────────────────────────────────────────
  - get: L:A22X Master Caution Warning
    set: "(>B:AIRLINER_FCU_MASTER_CAUTION_1_Set)"

  # ── Chrono ────────────────────────────────────────────────────────────────
  - get: L:A22X L Chrono, Number
    set: (>B:AIRLINER_FCU_CHRONO_1_Set)
  - get: L:A22X R Chrono, Number
    set: (>B:AIRLINER_FCU_CHRONO_2_Set)

  # ── Sidestick Priority ────────────────────────────────────────────────────
  - get: B:AIRLINER_FCU_SIDESTICK_PRIORITY_1_COVER
    set: (>B:AIRLINER_FCU_SIDESTICK_PRIORITY_1_COVER_Set)
  - get: B:AIRLINER_FCU_SIDESTICK_PRIORITY_2_COVER
    set: (>B:AIRLINER_FCU_SIDESTICK_PRIORITY_2_COVER_Set)
  - get: L:A22X L Sidestick Priority
  - get: L:A22X R Sidestick Priority

  # ── CPDLC ─────────────────────────────────────────────────────────────────
  - get: H:A220_FCU_CPDLC_ACPT
    set: (>B:AIRLINER_FCU_CPDLC_ACPT_1_Set)
  - get: H:A220_FCU_CPDLC_STBY
    set: (>B:AIRLINER_FCU_CPDLC_STBY_1_Set)
  - get: H:A220_FCU_CPDLC_RJCT
    set: (>B:AIRLINER_FCU_CPDLC_RJCT_1_Set)
  - get: H:A220_FCU_CPDLC_LOAD
    set: (>B:AIRLINER_FCU_CPDLC_LOAD_1_Set)
  - get: H:A220_FCU_CPDLC_REFRESH
    set: (>B:AIRLINER_FCU_CPDLC_REFRESH_1_Set)

  # ── RANGE ─────────────────────────────────────────────────────────────────

  # JS-only state in DisplayUnits; the H: events are all there is.
  - get: H:A220_CTP_RANGE_1_INC
  - get: H:A220_CTP_RANGE_1_DEC
  - get: H:A220_CTP_RANGE_2_INC
  - get: H:A220_CTP_RANGE_2_DEC

  - get: H:A220_CTP_WXR_1
    set: (>B:AIRLINER_CTP_WX_1_Set)
  - get: H:A220_CTP_WXR_2
    set: (>B:AIRLINER_CTP_WX_2_Set)

  # ── INDB DSPLY ────────────────────────────────────────────────────────────

  - get: H:A220_CTP_INDB_L_1
    set: (>B:AIRLINER_CTP_INDB_L_1_Set)
  - get: H:A220_CTP_INDB_L_2
    set: (>B:AIRLINER_CTP_INDB_L_2_Set)

  - get: H:A220_CTP_INDB_R_1
    set: (>B:AIRLINER_CTP_INDB_R_1_Set)
  - get: H:A220_CTP_INDB_R_2
    set: (>B:AIRLINER_CTP_INDB_R_2_Set)

  # ── Buttons ───────────────────────────────────────────────────────────────

  - get: H:A220_CTP_MAP_1
    set: (>B:AIRLINER_CTP_MAP_1_Set)
  - get: H:A220_CTP_MAP_2
    set: (>B:AIRLINER_CTP_MAP_1_Set)

  - get: H:A220_CTP_FMS_1
    set: (>B:AIRLINER_CTP_FMS_1_Set)
  - get: H:A220_CTP_FMS_2
    set: (>B:AIRLINER_CTP_FMS_2_Set)

  - get: H:A220_CTP_CNS_1
    set: (>B:AIRLINER_CTP_CNS_1_Set)
  - get: H:A220_CTP_CNS_2
    set: (>B:AIRLINER_CTP_CNS_2_Set)

  - get: H:A220_CTP_CHKL_1
    set: (>B:AIRLINER_CTP_CHKL_1_Set)
  - get: H:A220_CTP_CHKL_2
    set: (>B:AIRLINER_CTP_CHKL_2_Set)

  - get: H:A220_CTP_SYN_1
    set: (>B:AIRLINER_CTP_SYN_1_Set)
  - get: H:A220_CTP_SYN_2
    set: (>B:AIRLINER_CTP_SYN_2_Set)

  - get: H:A220_CTP_DATA_1
    set: (>B:AIRLINER_CTP_DATA_1_Set)
  - get: H:A220_CTP_DATA_2
    set: (>B:AIRLINER_CTP_DATA_2_Set)

  - get: H:A220_CTP_TERR_1
    set: (>B:AIRLINER_CTP_TERR_1_Set)
  - get: H:A220_CTP_TERR_2
    set: (>B:AIRLINER_CTP_TERR_2_Set)

  - get: H:A220_CTP_TFC_1
    set: (>B:AIRLINER_CTP_TFC_1_Set)
  - get: H:A220_CTP_TFC_2
    set: (>B:AIRLINER_CTP_TFC_2_Set)

  - get: H:A220_CTP_WX_1
    set: (>B:AIRLINER_CTP_WX_1_Set)
  - get: H:A220_CTP_WX_2
    set: (>B:AIRLINER_CTP_WX_2_Set)

  - get: L:A22X L Nav Source
    set: (>B:AIRLINER_CTP_NAV_1_Set)
  - get: L:A22X R Nav Source
    set: (>B:AIRLINER_CTP_NAV_2_Set)

  # ── Altimeters ────────────────────────────────────────────────────────────
  # With v1.0.9, Synaptic started writing to the KOHLSMAN vars, but is still
  # not reading from them.

  - get: A:KOHLSMAN SETTING MB:1, Millibars
    set: "`1 ${value * 16} (>K:2:KOHLSMAN_SET)`"
  - get: A:KOHLSMAN SETTING STD:1, Bool
    set: "value ? '1 (>K:BAROMETRIC_STD_PRESSURE)' : ''"

  - get: A:KOHLSMAN SETTING MB:2, Millibars
    set: "`2 ${value * 16} (>K:2:KOHLSMAN_SET)`"
  - get: A:KOHLSMAN SETTING STD:2, Bool
    set: "value ? '2 (>K:BAROMETRIC_STD_PRESSURE)' : ''"

  - get: A:KOHLSMAN SETTING MB:3, Millibars
    set: "`3 ${value * 16} (>K:2:KOHLSMAN_SET)`"
  - get: A:KOHLSMAN SETTING STD:3, Bool
    set: "value ? '3 (>K:BAROMETRIC_STD_PRESSURE)' : ''"

  - get: L:A22X L Altimeter HPA, Number
  - get: L:A22X R Altimeter HPA, Number

  # ═══ CONTROL TUNING PANEL ═════════════════════════════════════════════════
  # Minimums and CRS in the TUNE MENU not synced.

  - get: L:A22X L CTP Brightness
  - get: L:A22X R CTP Brightness

  - get: H:A220_CTP_LSK1_1
    set: (>B:AIRLINER_CTP_LSK1_1_Set)
  - get: H:A220_CTP_LSK1_2
    set: (>B:AIRLINER_CTP_LSK1_2_Set)
  - get: H:A220_CTP_LSK2_1
    set: (>B:AIRLINER_CTP_LSK2_1_Set)
  - get: H:A220_CTP_LSK2_2
    set: (>B:AIRLINER_CTP_LSK2_2_Set)
  - get: H:A220_CTP_LSK3_1
    set: (>B:AIRLINER_CTP_LSK3_1_Set)
  - get: H:A220_CTP_LSK3_2
    set: (>B:AIRLINER_CTP_LSK3_2_Set)
  - get: H:A220_CTP_LSK4_1
    set: (>B:AIRLINER_CTP_LSK4_1_Set)
  - get: H:A220_CTP_LSK4_2
    set: (>B:AIRLINER_CTP_LSK4_2_Set)

  - get: H:A220_CTP_RSK1_1
    set: (>B:AIRLINER_CTP_RSK1_1_Set)
  - get: H:A220_CTP_RSK1_2
    set: (>B:AIRLINER_CTP_RSK1_2_Set)
  - get: H:A220_CTP_RSK2_1
    set: (>B:AIRLINER_CTP_RSK2_1_Set)
  - get: H:A220_CTP_RSK2_2
    set: (>B:AIRLINER_CTP_RSK2_2_Set)
  - get: H:A220_CTP_RSK3_1
    set: (>B:AIRLINER_CTP_RSK3_1_Set)
  - get: H:A220_CTP_RSK3_2
    set: (>B:AIRLINER_CTP_RSK3_2_Set)

  - get: H:A220_CTP_TUNE_1
    set: (>B:AIRLINER_CTP_TUNE_1_Set)
  - get: H:A220_CTP_TUNE_2
    set: (>B:AIRLINER_CTP_TUNE_2_Set)

  - get: L:A22X L CTP Crosstune, Number
    set: (>B:AIRLINER_CTP_ACROSS_1_Set)
  - get: L:A22X R CTP Crosstune, Number
    set: (>B:AIRLINER_CTP_ACROSS_2_Set)

  # ── Frequencies & Transponder ─────────────────────────────────────────────
  - get: A:COM ACTIVE FREQUENCY:1, Hz
    set: (>K:COM_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:1, Hz
    set: (>K:COM_STBY_RADIO_SET_HZ)
  - get: A:COM ACTIVE FREQUENCY:2, Hz
    set: (>K:COM2_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:2, Hz
    set: (>K:COM2_STBY_RADIO_SET_HZ)
  - get: A:COM ACTIVE FREQUENCY:3, Hz
    set: (>K:COM3_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:3, Hz
    set: (>K:COM3_STBY_RADIO_SET_HZ)
  - get: A:NAV STANDBY FREQUENCY:1, Hz
    set: (>K:NAV1_STBY_SET_HZ)
  - get: A:NAV STANDBY FREQUENCY:2, Hz
    set: (>K:NAV2_STBY_SET_HZ)

  - get: A:TRANSPONDER CODE:1, BCO16
    set: (>K:XPNDR_SET)
  - get: A:TRANSPONDER IDENT:1, Bool
    set: "value ? '1 (>K:XPNDR_IDENT_ON)' : '1 (>K:XPNDR_IDENT_OFF)'"

  # ═══ FLIGHT CONTROL PANEL ═════════════════════════════════════════════════

  - get: L:A22X FCP Brightness

  - get: L:A22X L Flight Director
    set: "`${!!value !== !!current ? '1 (>B:AIRLINER_FCU_FD_1_Set)' : ''}`"
  - get: L:A22X R Flight Director
    set: "`${!!value !== !!current ? '1 (>B:AIRLINER_FCU_FD_2_Set)' : ''}`"

  - get: L:A22X AP Master
    set: "value != current ? '(>B:AIRLINER_FCU_AP_Set)' : ''"
  - get: L:A22X AT Master
    set: "value != current ? '(>B:AIRLINER_FCU_AT_Set)' : ''"

  - get: L:A22X FG Source
    set: "value != current ? '1 (>L:A22X FG Source Transfer)' : ''"

  - get: B:AIRLINER_FCU_EDM_COVER
    set: (>B:AIRLINER_FCU_EDM_COVER_Set)
  - get: L:A22X FG EDM
    set: "value != current ? '1 (>B:AIRLINER_FCU_EDM_Set)' : ''"

  # ── Speed ─────────────────────────────────────────────────────────────────
  - get: L:A22X FG Speed Mode

  - get: K:AP_SPD_VAR_INC
  - get: K:AP_SPD_VAR_DEC
  - get: K:AP_MANAGED_SPEED_IN_MACH_TOGGLE # TODO: Switch to non-toggle?

  # ── Heading / Nav / Approach ──────────────────────────────────────────────

  - get: L:A22X FG Heading
    set: "value != current ? '(>B:AIRLINER_FCU_HDG_Set)' : ''"

  # HEADING KNOB
  # Not possible to implement a direct value sync. Not possible to repeat an inc/dec
  # based on delta between peers either as Synaptic collapses the sequence into a
  # single change. Falling back to syncing inc/dev events...
  # - get: A:AUTOPILOT HEADING LOCK DIR, Degrees
  #   set: >
  #     (() => {
  #       let delta = value - current;
  #       if (delta > 180) delta -= 360;
  #       if (delta < -180) delta += 360;
  #       const steps = Math.round(delta);
  #       if (steps === 0) return '';
  #       const event = steps > 0 ? '(>K:HEADING_BUG_INC)' : '(>K:HEADING_BUG_DEC)';
  #       return Array(Math.abs(steps)).fill(event).join(' ');
  #     })()
  - get: K:HEADING_BUG_INC
  - get: K:HEADING_BUG_DEC
  - get: K:HEADING_BUG_SET # PUSH SYNC

  - get: L:A22X FG LNAV
    set: "value != current ? '(>B:AIRLINER_FCU_NAV_Set)' : ''"

  - get: L:A22X FG Approach
    set: "value != current ? '(>B:AIRLINER_FCU_APPR_Set)' : ''"

  - get: L:A22X FG Half Bank
    set: (>B:AIRLINER_FCU_BANK_Set)

  # ── Altitude ──────────────────────────────────────────────────────────────

  - get: L:A22X FG Flight Level
    set: "value != current ? '(>B:AIRLINER_FCU_FLC_Set)' : ''"

  - get: L:A22X FG Altitude
    set: "value != current ? '(>B:AIRLINER_FCU_ALT_Set)' : ''"

  - get: L:A22X FG VNAV
    set: "value != current ? '1 (>B:AIRLINER_FCU_VNAV_Set)' : ''"

  - get: L:A22X FG Altitude Unit
  - get: L:A22X FG Altitude Fine
    set: "`${!!value !== !!current ? '1 (>B:AIRLINER_FCU_ALT_PUSH_PUSH_Set)' : ''}`"

  - get: K:AP_ALT_VAR_INC
  - get: K:AP_ALT_VAR_DEC

  # ── Vertical Speed ────────────────────────────────────────────────────────

  - get: L:A22X FG Vertical Speed
    set: "value != current ? '(>B:AIRLINER_FCU_VS_Set)' : ''"

  - get: L:A22X FG Flight Path Angle
    set: "value != current ? '(>B:AIRLINER_FCU_FPA_Set)' : ''"

  - get: K:AP_VS_VAR_INC
  - get: K:AP_VS_VAR_DEC

  # ═══ OVERHEAD ═════════════════════════════════════════════════════════════

  - get: L:A22X Entrance Lights, Number
  - get: L:A22X Dome Lights, Number

  # ── AURAL WAWRN ───────────────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_AURAL_WARN_COVER
    set: (>B:AIRLINER_OVH_AURAL_WARN_COVER_Set)
  - get: L:A22X Aural Warn Inhibit, Number

  # ── PROBE HEAT ────────────────────────────────────────────────────────────
  - get: L:A22X Probe Heat, Number

  # ── WINDOW HEAT ───────────────────────────────────────────────────────────
  - get: L:A22X L Side Window Heat Off, Number
  - get: L:A22X R Side Window Heat Off, Number
  - get: L:A22X L Windshield Heat Off, Number
  - get: L:A22X R Windshield Heat Off, Number

  # ── PRIM FLT CTRL ─────────────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_PFCC_1_COVER
    set: (>B:AIRLINER_OVH_PFCC_1_COVER_Set)
  - get: B:AIRLINER_OVH_PFCC_2_COVER
    set: (>B:AIRLINER_OVH_PFCC_2_COVER_Set)
  - get: B:AIRLINER_OVH_PFCC_3_COVER
    set: (>B:AIRLINER_OVH_PFCC_3_COVER_Set)
  - get: L:A22X PFCC 1 Off, Number
  - get: L:A22X PFCC 2 Off, Number
  - get: L:A22X PFCC 3 Off, Number

  # ── CVR ───────────────────────────────────────────────────────────────────
  - get: L:A22X CVR Test, Number
    set: (>B:AIRLINER_OVH_CVR_TEST_Set)
  - get: L:A22X CVR Erase, Number
    set: (>B:AIRLINER_OVH_CVR_ERASE_Set)

  # ── SERV INT & MECH CALL ──────────────────────────────────────────────────
  - get: L:A22X Mech Call, Number
    set: (>B:AIRLINER_OVH_MECH_CALL_Set)
  - get: L:A22X Service Intercom, Number

  # ── Engine Fire & Bottles ─────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_FIRE_L_COVER
    set: (>B:AIRLINER_OVH_FIRE_L_COVER_Set)
  - get: B:AIRLINER_OVH_FIRE_APU_COVER
    set: (>B:AIRLINER_OVH_FIRE_APU_COVER_Set)
  - get: B:AIRLINER_OVH_FIRE_R_COVER
    set: (>B:AIRLINER_OVH_FIRE_R_COVER_Set)

  - get: L:A22X L Eng Fire, Number
    set: (>B:AIRLINER_OVH_FIRE_L_Set)
  - get: L:A22X APU Fire, Number
  - get: L:A22X R Eng Fire, Number
    set: (>B:AIRLINER_OVH_FIRE_R_Set)

  - get: L:A22X L Eng Fire Bottle 1, Number
  - get: L:A22X L Eng Fire Bottle 2, Number
  - get: L:A22X APU Bottle 1, Number
  - get: L:A22X R Eng Fire Bottle 1, Number
  - get: L:A22X R Eng Fire Bottle 2, Number

  # ── Hydraulic ─────────────────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_HYD_1_SOV_COVER
    set: (>B:AIRLINER_OVH_HYD_1_SOV_COVER_Set)
  - get: B:AIRLINER_OVH_HYD_2_SOV_COVER
    set: (>B:AIRLINER_OVH_HYD_2_SOV_COVER_Set)
  - get: L:A22X Hyd 1 SOV, Number
  - get: L:A22X Hyd 2 SOV, Number
  - get: L:A22X ACMP 3A, Number
  - get: L:A22X ACMP 3B, Number
  - get: L:A22X ACMP 2B, Number
  - get: L:A22X PTU, Number

  # ── Electrical ────────────────────────────────────────────────────────────
  - get: L:A22X Bus Isolation Mode, Number

  - get: B:AIRLINER_OVH_ELEC_CABIN_PWR_COVER
    set: (>B:AIRLINER_OVH_ELEC_CABIN_PWR_COVER_Set)
  - get: L:A22X Cabin Power Off, Number

  - get: B:AIRLINER_OVH_ELEC_RAT_GEN_COVER
    set: (>B:AIRLINER_OVH_ELEC_RAT_GEN_COVER_Set)
  - get: L:A22X RAT Gen, Number

  - get: A:ELECTRICAL MASTER BATTERY:1, Bool
    set: (>K:BATTERY1_SET)
  - get: A:ELECTRICAL MASTER BATTERY:2, Bool
    set: (>K:BATTERY2_SET)

  - get: L:A22X External Power In Use, Number
    set: "!!value !== !!current ? '1 (>B:AIRLINER_OVH_EXT_PWR_Set)' : ''"

  - get: L:A22X L Gen Off, Number
  - get: L:A22X R Gen Off, Number
  - get: L:A22X APU Gen Off, Number

  - get: B:AIRLINER_OVH_L_DISC_COVER
    set: (>B:AIRLINER_OVH_L_DISC_COVER_Set)
  - get: B:AIRLINER_OVH_R_DISC_COVER
    set: (>B:AIRLINER_OVH_R_DISC_COVER_Set)
  - get: L:A22X L Gen Disc, Number
  - get: L:A22X R Gen Disc, Number

  # ── APU ───────────────────────────────────────────────────────────────────
  - get: L:A22X APU Switch, Number

  # ── TAWS ──────────────────────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_TAWS_GEAR_COVER
    set: (>B:AIRLINER_OVH_TAWS_GEAR_COVER_Set)
  - get: L:A22X TAWS Gear Inhibit, Number

  - get: B:AIRLINER_OVH_TAWS_TERR_COVER
    set: (>B:AIRLINER_OVH_TAWS_TERR_COVER_Set)
  - get: L:A22X TAWS Terrain Inhibit, Number

  - get: B:AIRLINER_OVH_TAWS_FLAP_COVER
    set: (>B:AIRLINER_OVH_TAWS_FLAP_COVER_Set)
  - get: L:A22X TAWS Flaps Inhibit, Number

  - get: L:A22X TAWS GS Inhibit, Number

  # ── Fuel ──────────────────────────────────────────────────────────────────
  - get: L:A22X L Boost Pump, Number
  - get: L:A22X R Boost Pump, Number
  - get: L:A22X Manual Transfer, Number
  - get: L:A22X Gravity Transfer, Number

  # ── Air - Bleed & Packs ───────────────────────────────────────────────────
  - get: L:A22X Cockpit Air, Number
  - get: L:A22X Fwd Cabin Air, Number
  - get: L:A22X Aft Cabin Air, Number

  - get: L:A22X Manual Temperature, Number

  - get: L:A22X Fwd Cargo Air, Number
  - get: L:A22X Aft Cargo Air, Number

  - get: L:A22X Trim Air Off, Number

  - get: L:A22X Pack Flow, Number

  - get: L:A22X Recirc Air Off, Number

  - get: B:AIRLINER_OVH_AIR_RAM_COVER
    set: (>B:AIRLINER_OVH_AIR_RAM_COVER_Set)
  - get: L:A22X Ram Air, Number

  - get: L:A22X L Pack Off, Number
  - get: L:A22X R Pack Off, Number

  - get: L:A22X L Bleed Off, Number
  - get: L:A22X R Bleed Off, Number
  - get: L:A22X APU Bleed Off, Number
  - get: L:A22X Crossbleed, Number

  # ── Anti-ice ──────────────────────────────────────────────────────────────
  - get: L:A22X L Cowl Anti Ice, Number
  - get: L:A22X R Cowl Anti Ice, Number
  - get: L:A22X Wing Anti Ice, Number

  # ── ELT ───────────────────────────────────────────────────────────────────
  - get: L:A22X Emer Transmitter, Number

  # ── Cargo Fire ────────────────────────────────────────────────────────────
  - get: B:AIRLINER_OVH_FIRE_CARGO_FWD_COVER
    set: (>B:AIRLINER_OVH_FIRE_CARGO_FWD_COVER_Set)
  - get: L:A22X Cargo Fwd Fire, Number
  - get: B:AIRLINER_OVH_FIRE_CARGO_AFT_COVER
    set: (>B:AIRLINER_OVH_FIRE_CARGO_AFT_COVER_Set)
  - get: L:A22X Cargo Aft Fire, Number
  - get: L:A22X Cargo Fire Bottle, Number

  # ── Equipment Cooling ─────────────────────────────────────────────────────
  - get: L:A22X Cooling Inlet, Number
