    set: (>K:PROP_PITCH1_SET)
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:2, position 16k # PROPELLER 2 LEVER
    set: (>K:PROP_PITCH2_SET) 
  - get: A:GENERAL ENG MIXTURE LEVER POSITION:1, position 16k # MIXTURE 1 LEVER 
