# Black Square Baron 58Pro variant - FsCopilot YAML Configuration
# Version: 0.0.5
# Created By: DKgolfnut
# Special Thanks: 
# Date: 9/7/2026 

# Known Issues:
 # - Make sure you have the PMS50_GTN_650-750.yaml file in the modules folder
 # - Starting Engines - they are finicky due to BKSQ desire to make this as real as possible. If the engines do not start together, the second pilot may have to start the engine after the first pilot using the starter and moving throttles or disconnect/leave the session, start engines and rejoin the FSC session. I can remove the "Starter HELD logic" if this is too impactful.

# FIXES:
   # - 9/7/2026 
     # - Corrected Flap operation
   # - 4/12/2026 
     # - Yury Updated Syntax for :1 showing before argument and K:2: logic 
  # - 4/1/2026
   # - Fixed issue with the ELT switch not working correctly
 # - 3-26-2026
   # - I added all breakers on Pilot side, but they are not animating due to no trigger event on the A:CIRCUIT CONNECTION ON:x Avars. This is a BKSQ issue. I will leave these in incase they fix it. All breakers on the right side near Glove box are functioning correctly.
   # Added Alternate Static Port switch
 # - 3-25-2026
   # - Initial release. 
   # - All functionality is working including all breakers with the exception of the Engine starting difficulty called out above. 

include:
  - modules/PMS50_GTN_650-750.yaml
  - modules/AS_GNS430.yaml
  - modules/AS_GNS530.yaml
  - modules/fuel.yaml
  - modules/payload.yaml

master: 
