# FlightFX Citation X (CE750W) - FsCopilot YAML Configuration
# Version: 0.0.3
# Created By: DKgolfnut
# Special Thanks: 
# Date: 4/12/2026 

# Known Issues:
 # - BARO STD buttons on PFD's do not have a functional trigger. So Both Pilots will need to hit the Keyboard button they have mapped, to set the Baro to STD when needed. 
 # - MAIN SCREENS (MFD's amd EICAS) BTNS need slow click when making choices to keep sync. Same with Autopilot BTN's
 # - Typical Knob turn desync, but I would say the knobs stay pretty close in general. If Desync occurs, have the Second pilot LEAVE from session, set to match and rejoin. If this becomes too burdensome, I can remove the knobs that are problematic from sync for MANUAL PF and PM adustments.
# FIXES:
   # - 4/12/2026 
     # - Yury Updated Syntax for :1 showing before argument and K:2: logic 
     # - Fixed Previous Page and Next Page buttons on FMC
   # - Initial release 3/31/2026
   # - All functions are in the profile for cockpit and cabin. 

