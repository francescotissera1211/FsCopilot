#How2
#- 1. Spawn. Make sure the Electric master is off!! Double check that your weather settings are identical.
#- 2. Connect with your friend. The Master aircraft will send its configuration to the slave aircraft.
#- 3. Verify the configuration has been sent over by comparing altimeters. They should match exactly!
#- 4. Turn on the Electric master, a CAS advisory message will display which config is being used. (Master = Yours, Slave = Friend's)
#- 69. Have fun :) 

#DUAL INPUTS:
#- This aircraft support dual input of Ailerons, Elevator, Rudder, Brakes, Trim, and throttle, prop and mixture levers.
#- Hold the AP Disconnect button for 5 seconds to toggle dual input.
#- Inputs are sent at 10hz to reduce network usage. 

#Tips, recomendations, Advice:
#- The master aircraft should perform the start. Use the mouse to operate the starter and hold the starter longer a little longer.
#- Operate engine and G1000 controls slowly and smoothly to mitigate desyncs.
#- Some items like fuel quantity, weights, temps, etc. may require manual syncing or will will sync later in the flight.


