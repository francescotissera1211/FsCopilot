    set: (>K:PROP_PITCH1_SET)
  - get: A:GENERAL ENG MIXTURE LEVER POSITION:1, position 16k # - MIXTURE 1 LEVER 
  - get: L:BKSQ_MixtureLeverPosition_1, Percent 
  - get: L:BKSQ_TurboCharged, Bool
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
 # - # FLAP Levers
  - get: A:FLAPS HANDLE INDEX, Number # FLAPS
    set: |
      switch (value) {
          case  0: return '0 (>K:FLAPS_CONTINUOUS_SET)'
          case  1: return '5461 (>K:FLAPS_CONTINUOUS_SET)'
          case  2: return '10922 (>K:FLAPS_CONTINUOUS_SET)'
          case  3: return '16383 (>K:FLAPS_CONTINUOUS_SET)'
          default: return ''
      }
 # - # Condition Lever
  - get: L:Condition_Lever_CutOff_1
  - get: B:FUEL_1_Condition_Lever, Number 
    set: |  
      switch (value) {
          case 0: return '(>B:FUEL_1_Condition_Lever_High_Idle)' 
          case 1: return '(>B:FUEL_1_Condition_Lever_Low_Idle)'  
          case 2: return '(>B:FUEL_1_Condition_Lever_Cut_Off)' 
          default: return ''
      }     
  - get: A:GENERAL ENG FUEL VALVE:1, Bool
    set: (>K:SET_FUEL_VALVE_ENG1)    
