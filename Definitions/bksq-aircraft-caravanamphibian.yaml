# Black Square Caravan Pro Amphibian variant - FsCopilot YAML Configuration
# Version: 0.0.1
# Created By: DKgolfnut
# Special Thanks: type10hitomaru for helping me test the Supercargo version
# Date: 4/7/2026 

# Known Issues:
  # - Initial release all functions working. Make sure you set up the plane as no damage on Engine, etc, so it isn't affected by one pilot having Turbine, filter, etc
  # - GENERATOR SWITCH is not ANIMATED, but functions to RESET, ON, TRIP function. You must hold the switch in RESET or TRIP for 2-3 seconds for it to register. 
  # - VLOC and GPS selection should only be selected using the GPS/NAV BTN above Pilot Yoke on front panel or the GPS/NAV BTN on Copilot Side above AirSPeed and Cabin Temp. Selecting on the GPS/VLOC via CDI BTN will cause issues with sync (Reverts back). 
  # -  OPENING and CLOSING doors sometimes takes a double left click to get them to move via EFB.    
  # - KX155B TRANSFER/SWAP BUTTONS NOT SYNCHING on the KX155B radios. Both Pilots must press the button to transfer Standby to Active. 
  # - KLN90B requires this package from GitHub installed in Communityy Folder. https://github.com/falcon71/kln90b/releases
# FIXED:
  # - 4/7/2026 
     # - ADDED CONTROL LOCK add/remove visuals
     # - CONMMENTED OUT DOOR VARS as EFB handles them
