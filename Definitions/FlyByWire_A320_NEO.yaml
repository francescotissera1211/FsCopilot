    set: "value ? '(>K:A32NX.FCU_HDG_PUSH)' : '(>K:A32NX.FCU_HDG_PULL)'"
  - get: L:A32NX_FCU_LOC_LIGHT_ON                               # LOC Button
    set: (>K:A32NX.FCU_LOC_PUSH)

