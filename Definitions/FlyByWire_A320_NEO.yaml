# FlyByWire A320NX - FsCopilot Profile
# Created By: TheMaverick88
# Special Thanks: lime90 and lolodom
# Version: 0.9
# Date: 5/16/2026
# FIXES:
#   - Fixed NAV & LOGO LT switch processing after FBW update
# KNOWN ISSUES:
#   - V/S or FPA will display on the FCU throughout the flight; will only switch to V/S mode if selected by either pilot
#   - Speed or Mach may display periodically on the FCU; will only switch to SPD/MACH mode if selected by either pilot
#   - Autothrust may disengage if PM's throttle hardware doesn't match the aircraft
#   - APPR desnc issues
# LIMITATIONS:
#   - EFB not fully synced
#   - Toggle metric altitude display button cannot be synced at this time
#   - Flight control trimming

master:
