# Glareshield
  # EFIS L
  - get: L:PUSH_AUTOPILOT_MASTERAWARN_L                         # MASTER WARNING Button
  - get: L:PUSH_AUTOPILOT_MASTERCAUT_L                          # MASTER CAUTION Button
