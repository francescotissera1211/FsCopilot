    set: (>K:A32NX.FCU_AP_1_PUSH)
  - get: L:A32NX_FCU_AP_2_LIGHT_ON                              # AP2 Button
    set: (>K:A32NX.FCU_AP_2_PUSH)
  - get: L:A32NX_AUTOTHRUST_STATUS                              # A/THR Button
    set:  |
      switch (value) {
        case 0: return '(>K:AUTO_THROTTLE_DISCONNECT)'
        case 1: return '(>K:AUTO_THROTTLE_ARM)'
        case 2: return '(>K:AUTO_THROTTLE_ARM)'
        default: return ''
      }
      
  - get: L:A32NX_FCU_ALT_INCREMENT_1000                         # ALT Knob 100/1000 Collar
