  - get: L:A32NX_FCU_EFIS_L_DISPLAY_BARO_VALUE                  # L EFIS Baro Knob
    set:  |
      if (value >= 745 && value <= 1100) {
        return `${value * 16}` + ' (>K:A32NX.FCU_EFIS_L_BARO_SET)'
      } else if (value >= 22 && value <= 32.48) {
        return `${value * 541.824}` + ' (>K:A32NX.FCU_EFIS_L_BARO_SET)'
      }
  - get: L:A32NX_FCU_EFIS_L_DISPLAY_BARO_MODE                   # L EFIS Baro Knob Push/Pull
    set:  |
      switch (value) {
        case 0: return '(>K:A32NX.FCU_EFIS_L_BARO_PULL)'
        case 1: return '(>K:A32NX.FCU_EFIS_L_BARO_PUSH)'
        case 2: return '(>K:A32NX.FCU_EFIS_L_BARO_PUSH)'
        default: return ''
      }
