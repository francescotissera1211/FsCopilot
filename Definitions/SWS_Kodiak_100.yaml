master:
# TRIMS
  - get: A:AILERON TRIM PCT, Percent over 100 # AILERON TRIM
  - get: A:ELEVATOR TRIM PCT, Percent scaler 16k # ELEVATOR TRIM BTN
    set: (>K:ELEVATOR_TRIM_SET) 
  - get: A:RUDDER TRIM PCT, Percent # RUDDER TRIM BTN
    set: (>K:RUDDER_TRIM_SET) 
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER
  - get: L:SWS_ENGINE_Lever_Emergencypower_1, Percent
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:1, position 16k # PROPELLER 1 LEVER
    set: (>K:PROP_PITCH1_SET)
  - get: A:GENERAL ENG MIXTURE LEVER POSITION:1, position 16k # MIXTURE 1 LEVER
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  - get: L:RUDDERINPUT
