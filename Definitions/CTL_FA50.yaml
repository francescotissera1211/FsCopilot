# Contrail - Dessault Faclon 50 V1.0
# Created by Dustin with amazing mentorship form Dkgolgnut-Dennis
# Tested by Dustin & PilotC

# Known Issues:
  # Initial Release - first profile
  # CRS 1/2 push dirct doesnt work
  # Overhead circut breaker light doesnt sync
  # All knobs must be turn at a "noramal" speed to avoid syncing isues
  # Map light knobs not synced
  
# IMPORTANT!
  # Course MODE IS NOT SYNCED ON PILOT/COPILOT ND DISPLAY BOTH PILOTS MUST SET THE PILOT ND TO FMS MODE FOR THE AP TO SYNC FMS MODE
  # Landing gear lever sometimes loses sync do to different players control configs / hardware
  # TRIM IS SYNCED TO MASTER CONTROL and AP. can lose sync aswell depending on players control configs.
   # I have it set to work with the ingame setting of "elevator nose trim down/up" I recommend making sure both pilots are at same value before connecting

      
include:
  - modules/payload.yaml
  - modules/fuel.yaml

master: 
  - get: A:STEER INPUT CONTROL, Position 16k
    set: "`${value * -1} (>K:AXIS_STEERING_SET)`"
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, Position 16k
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, Position 16k
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:3, Position 16k
  - get: A:ELEVATOR POSITION, Position 16k
    set: "`${value * -1} (>K:AXIS_ELEVATOR_SET)`"
  - get: A:AILERON POSITION, Position 16k
    set: "`${value * -1} (>K:AXIS_AILERONS_SET)`"
  - get: A:RUDDER POSITION, Position 16k
    set: "`${value * -1} (>K:AXIS_RUDDER_SET)`"
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  - get: L:CTL_FA50_TRIM_ELEV_PCT, Number
  - get: L:CTL_FA50_YOKE_TRIM_SWITCH_PILOT, bool
    set: (>B:HANDLING_ElevTrim_set)

  


