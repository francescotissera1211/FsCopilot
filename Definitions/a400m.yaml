# iniBuilds A400M Atlas
# Built from confirmed INI_ LVAR list (May 2026)
# 4-engine military turboprop - uses INI_ namespace same as iniBuilds A350
# Created for FS Copilot shared cockpit

master:
# Throttle - 4 engines
# Confirmed from Behaviors panel - reads INI_3D_THROTTLE_LEVER_POSITION_X_ANIMATION, sets via B:ENGINE_Throttle_X_Set
- get: L:INI_3D_THROTTLE_LEVER_POSITION_1_ANIMATION, Number
  set: "`${value} (>B:ENGINE_Throttle_1_Set)`"
- get: L:INI_3D_THROTTLE_LEVER_POSITION_2_ANIMATION, Number
  set: "`${value} (>B:ENGINE_Throttle_2_Set)`"
- get: L:INI_3D_THROTTLE_LEVER_POSITION_3_ANIMATION, Number
  set: "`${value} (>B:ENGINE_Throttle_3_Set)`"
- get: L:INI_3D_THROTTLE_LEVER_POSITION_4_ANIMATION, Number
  set: "`${value} (>B:ENGINE_Throttle_4_Set)`"
# Brakes
- get: A:BRAKE LEFT POSITION EX1, Position 32k
  set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
- get: A:BRAKE RIGHT POSITION EX1, Position 32k
  set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
# Trim
- get: A:RUDDER TRIM PCT, Position 16k
  set: (>K:RUDDER_TRIM_SET_EX1)
- get: A:ELEVATOR TRIM PCT, Position 16k
  set: (>K:ELEVATOR_TRIM_SET)
- get: A:AILERON TRIM PCT, Position 16k
  set: (>K:AILERON_TRIM_SET_EX1)
# Engine starters - master only, each pilot cranks their own
# NOTE: Engines NOT synced to prevent start loop

shared:
  # FLIGHT CONTROLS
  - get: A:ELEVATOR POSITION, Position 16k
    set: (>K:ELEVATOR_SET)
  - get: A:AILERON POSITION, Position 16k
    set: (>K:AILERON_SET)
  - get: A:RUDDER POSITION, Position 16k
    set: (>K:RUDDER_SET)
  - get: L:INI_SPOILERS_ARMED, Bool
    set: "`${value} (>L:INI_SPOILERS_ARMED)`"
  - get: L:INI_SPOILERS_HANDLE_POSITION, Number
    set: "`${value} (>L:INI_SPOILERS_HANDLE_POSITION)`"
  - get: A:GEAR HANDLE POSITION, Bool
    set: (>K:GEAR_SET)
  - get: A:BRAKE PARKING INDICATOR, Bool
    set: (>K:PARKING_BRAKES)

  # FLAPS
  - get: A:FLAPS HANDLE PERCENT, Position 16k
    set: "`${value} (>B:HANDLING_Flaps_Set)`"

  # AUTOBRAKE
  - get: L:INI_AUTOBRAKE_LEVEL, Number
    set: "`${value} (>L:INI_AUTOBRAKE_LEVEL)`"
  - get: L:INI_ANTISKID_SWITCH, Bool
    set: "`${value} (>L:INI_ANTISKID_SWITCH)`"
