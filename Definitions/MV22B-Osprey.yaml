# Known Issues:
 # - 4/22/26
   # - Initial release for testing

# FIXES:
   # - 
include:

  - modules/fuel.yaml
  - modules/payload.yaml

master: 
  - get: A:AILERON TRIM PCT, Percent over 100 # AILERON TRIM
  - get: A:ELEVATOR TRIM PCT, Percent scaler 16k # ELEVATOR TRIM BTN
    set: (>K:ELEVATOR_TRIM_SET) 
  - get: A:RUDDER TRIM PCT, Percent # RUDDER TRIM BTN
    set: (>K:RUDDER_TRIM_SET) 
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, position 16k # Throttle 2 LEVER
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:1, position 16k # PROPELLER 1 LEVER
    set: (>K:PROP_PITCH1_SET)
  - get: A:GENERAL ENG PROPELLER LEVER POSITION:2, position 16k # PROPELLER 2 LEVER
    set: (>K:PROP_PITCH2_SET) 

  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
## _ NACELLE rotation
  - get: L:NacellesRotation
  - get: L:MARYADI0534, Number
    set: "value > current ? '0 (>K:INC_COWL_FLAPS4)' : '0 (>K:DEC_COWL_FLAPS4)'"

shared:
#   #############  AUTOPILOT KNOBS #############
  - get: A:AUTOPILOT HEADING LOCK DIR, Degrees
    set: "`${value} (>K:HEADING_BUG_SET)`"
#  - get: K:HEADING_BUG_Inc
  - get: A:NAV OBS:1, Degrees
  - get: L:MARYADIO130, Number
    set: "value > current ? '(>K:VOR1_OBI_INC)' : '(>K:VOR1_OBI_DEC)'"
  - get: A:AUTOPILOT AIRSPEED HOLD VAR:1, Knots
    set: "`${value} (>K:AP_SPD_VAR_SET)`"    
  - get: A:AUTOPILOT ALTITUDE LOCK VAR, Feet
  - get: A:AUTOPILOT VERTICAL HOLD VAR, Ft/min


##  - #############  CoPILOT PANELS #############
##  - ## CoPilot INTERCOM PANEL ##
  - get: L:INTERN_2_COMM_1
  - get: L:INTERN_2_COMM_2
  - get: L:INTERN_2_COMM_3
  - get: L:INTERN_2_COMM_4
  - get: L:INTERN_2_ICS
  - get: L:INTERN_2_TACAN
