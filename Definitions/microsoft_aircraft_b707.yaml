# known problems:
# some momentary switches are not animated, but their functions are available (outputs to L:1 vars)
# some other momentary switches will not be held on another client (outputs to B: vars)
# radalt bug might be quirky, as variable cannot be set directly
# requires same settings in all client's efb companian app
# trim is weird with AP on
# If a generator is paralleled by closing a BTB, the switch may need to be actuated multiple times, best option is to not fail a parallel
# AC paralleling egde cases not tested (such as if the momentary closing of a tripped BTB during a failed manual parallel cause a force parallel)

include:
  - modules/AS_GNS530.yaml
  - modules/payload.yaml

ignore:
  - EFB

master:
  # fuel tanks
  - get: A:FUELSYSTEM TANK WEIGHT:1, kg
  - get: A:FUELSYSTEM TANK WEIGHT:2, kg
  - get: A:FUELSYSTEM TANK WEIGHT:3, kg
  - get: A:FUELSYSTEM TANK WEIGHT:4, kg
  - get: A:FUELSYSTEM TANK WEIGHT:5, kg
  - get: A:FUELSYSTEM TANK WEIGHT:6, kg
  - get: A:FUELSYSTEM TANK WEIGHT:7, kg
  # flight controls
  - get: A:YOKE Y POSITION, Position 16k
  - get: A:YOKE X POSITION, Position 16k
  - get: A:RUDDER POSITION, Position 16k
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
  - get: A:AUTOPILOT PITCH HOLD REF, degree
  # DG compass--deprecated, vars are effectively read only
  # - get: L:1:WT_B707_COMPASS_HEADING_1
  # - get: L:1:WT_B707_COMPASS_HEADING_2
  # AC Paralleling--deperacated, javascript writes to generator frequency
  # - get: L:WT_B707_GENERATOR_1_FREQ
  # - get: L:WT_B707_GENERATOR_2_FREQ
  # - get: L:WT_B707_GENERATOR_3_FREQ
  # - get: L:WT_B707_GENERATOR_4_FREQ










shared:
  # flight controls
  - get: A:ELEVATOR TRIM POSITION, Degree # RPN code only works in shared section, Do not override trim if AP is active, manual trimming synced only
    set: |
        return `(A:AUTOPILOT MASTER, Bool) 0 == if{ ${value} (>A:ELEVATOR TRIM POSITION, Degree) } els{}`
  - get: A:FLAPS HANDLE PERCENT:1, position 16k
    set: (>K:FLAPS_CONTINUOUS_SET)
  - get: A:SPOILERS HANDLE POSITION # There is no unit for this simvar
  - get: A:RUDDER TRIM PCT, percent over 100
  - get: A:AILERON TRIM PCT, percent over 100
  # allow other crew members to manipulate throttle
  - get: B:ENGINE_THROTTLE_1
    set: (>B:ENGINE_THROTTLE_1_Set)
  - get: B:ENGINE_THROTTLE_REVERSER_1
    set: (>B:ENGINE_THROTTLE_REVERSER_1_Set)
