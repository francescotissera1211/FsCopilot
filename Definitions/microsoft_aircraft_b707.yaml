  # FSCopilot AC generator paralleling synchronization
  # B707 simulates AC phase difference, but is initialised with a random number generator
  # since that number is internal to HTML/JS, it is impossible to write to with FSCopilot
  # this acts as a workaround
  # when a client detects a tripped BTB, it writes a variable to any client with a succesfully paralleled generator
  # that client detects that variable, and then forces all other clients to parallel that generator
  - get: A:LINE BREAKER PULLED:'acbus1tosyncbus'_n, bool
    set: |
        if(value == 1) {
            return "(A:LINE BREAKER PULLED:'eng1toacbus1'_n, bool) 0 == (A:LINE BREAKER PULLED:'acbus1tosyncbus'_n, bool) 0 == and if{ 1 (>L:FSC_SYNC_WT_B707_GEN1_FORCE_PARALLEL) }"
        }
  - get: L:FSC_SYNC_WT_B707_GEN1_FORCE_PARALLEL
    set: |
        switch (value) {
            case 1: return '(>H:WT_B707_Generator_1_Force_Paralleling) 0 (>L:FSC_SYNC_WT_B707_GEN1_FORCE_PARALLEL)'
            default: return ''
        }

  - get: A:LINE BREAKER PULLED:'acbus2tosyncbus'_n, bool
    set: |
        if(value == 1) {
            return "(A:LINE BREAKER PULLED:'eng2toacbus2'_n, bool) 0 == (A:LINE BREAKER PULLED:'acbus2tosyncbus'_n, bool) 0 == and if{ 1 (>L:FSC_SYNC_WT_B707_GEN2_FORCE_PARALLEL) }"
        }
  - get: L:FSC_SYNC_WT_B707_GEN2_FORCE_PARALLEL
    set: |
        switch (value) {
            case 1: return '(>H:WT_B707_Generator_2_Force_Paralleling) 0 (>L:FSC_SYNC_WT_B707_GEN2_FORCE_PARALLEL)'
            default: return ''
        }

  - get: A:LINE BREAKER PULLED:'acbus3tosyncbus'_n, bool
    set: |
        if(value == 1) {
            return "(A:LINE BREAKER PULLED:'eng3toacbus3'_n, bool) 0 == (A:LINE BREAKER PULLED:'acbus3tosyncbus'_n, bool) 0 == and if{ 1 (>L:FSC_SYNC_WT_B707_GEN3_FORCE_PARALLEL) }"
        }
  - get: L:FSC_SYNC_WT_B707_GEN3_FORCE_PARALLEL
    set: |
        switch (value) {
            case 1: return '(>H:WT_B707_Generator_3_Force_Paralleling) 0 (>L:FSC_SYNC_WT_B707_GEN3_FORCE_PARALLEL)'
            default: return ''
        }

  - get: A:LINE BREAKER PULLED:'acbus4tosyncbus'_n, bool
    set: |
        if(value == 1) {
            return "(A:LINE BREAKER PULLED:'eng4toacbus4'_n, bool) 0 == (A:LINE BREAKER PULLED:'acbus4tosyncbus'_n, bool) 0 == and if{ 1 (>L:FSC_SYNC_WT_B707_GEN4_FORCE_PARALLEL) }"
