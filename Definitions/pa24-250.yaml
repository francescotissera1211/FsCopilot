# A2A Simulations PA-24 Comanche.
# Author: xip
# Version: 0.0.1
# Updated: 2026-04-25

# NOTES
#
# This profile assumes that gyro drift is disabled on both sides. I simply
# haven't tried to make it work so if you are considering trying, please
# go ahead.
#
# ADF heading is currently not synced.
#
# TPM & trims are shared (both pilots can control). This allows for seamless
# help (e.g. if one pilot is learning), but if you have erratic inputs from
# your peripherals, there'll be issues, so you might want to comment these
# entries out under `shared:` and uncomment them under `master:`.

include:
  - modules/AS_GNS430.yaml
  - modules/AS_GNS530.yaml
  - modules/PMS50_GTN_650-750.yaml
  - modules/payload.yaml
  - modules/fuel.yaml

