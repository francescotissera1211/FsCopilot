# Known Issues:
  # - OBS 1 & 2 jump when the PIC moves the OBS. Not sure what's wrong with it. I removed all logic for it, but it still behaves the same. 
  # - *** RECOMMEND that PIC set his OBS to correct course, PNF sets his to correct course. PIC ajusts his up and back 1 degree to make his gauge correct. Disregard PNF gauge as it will jump to 0 but highlight the OBS (HOVER WIH MOUSE) and it will have the correct DEGREES. I tested this on LANDING and it followed VOR and ILS correctly even changing from PIC to PNF.
  # - BENDIX RNAV BTNS FOR FRQ (SWAP), FLT and SET are not synching. BOTH PILTS will need to hit them to stay in sync.


# FIXES:
   # - 10/19/2026 - Initial Release
   # - 10/19/2026 - All Switches, Levers, CKPT Windows, Etc. are working including all breaker switches on rear bulkhead. 

