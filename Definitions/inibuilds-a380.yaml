master:
  # --- 刹车踏板轴 ---
  - get: L:RIGHT_BRAKE_PEDAL_INPUT, Number
    set: "`${value * 32768 - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"

  - get: L:LEFT_BRAKE_PEDAL_INPUT, Number
    set: "`${value * 32768 - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"

  # --- 四发油门轴（A380 专有）---
  - get: L:INI_AXIS1_VALUE, Number
    set: "`${value * 16384} (>K:AXIS_THROTTLE1_SET)`"

  - get: L:INI_AXIS2_VALUE, Number
    set: "`${value * 16384} (>K:AXIS_THROTTLE2_SET)`"

  - get: L:INI_AXIS3_VALUE, Number
    set: "`${value * 16384} (>K:AXIS_THROTTLE3_SET)`"

  - get: L:INI_AXIS4_VALUE, Number
    set: "`${value * 16384} (>K:AXIS_THROTTLE4_SET)`"

  # --- 主飞行控制舵面 ---
  - get: A:ELEVATOR TRIM PCT, Percent scaler 16k
    set: (>K:ELEVATOR_TRIM_SET)

  - get: L:INI_SIDESTICK1_POSITION_X, Position 16k
    set: "`${(value * -16384)} (>K:AXIS_AILERONS_SET)`"

  - get: L:INI_SIDESTICK1_POSITION_Y, Position 16k
    set: "`${(value * -16384)} (>K:AXIS_ELEVATOR_SET)`"

  - get: L:INI_RUDDER_PEDAL_POSITION, Position 16k
    set: "`${(value * -16384)} (>K:AXIS_RUDDER_SET)`"  
 
