# Special Thanks: 
# Updated: 9/30/2026 

# Known Issues:
 # -CONNECTIVITY TO FSC is critical. Make sure you test the connection by:
 # -  Changing OVERHEAD PROBES HTG CAPT BTN to OFF (WHITE). If the second pilot button clicks to OFF (WHITE) then FLIPS to ON (DARK) while the HOST BTN stayed in the OFF (WHITE) position, the connection isn't workinig and is duplicatiing button clicks. If left in this state the Autopilot and most buttons will not work. 
 # - TO REMEDY THIS  the second pilot must disconnect/leave the session, rejoin and test that function again to validate the FSC connection is good. What I have found is, if the second pilot connection immediately goes Green and "Direct" not Yellow relay then green then the FSC connection is good.
# - ALL FLIGHTPLANS must be sent to the FMC via the EFB or some waypoints will not be added. This works perfectly with SIMBRIEF import or directly building in the EFB then send to the AVIONICS using the EFB Flightplan features.


# FIXED:
  # - 9/30/2026
   # - Fixed AP functions and VNAV 

include:

  - modules/fuel.yaml
  - modules/payload.yaml

master: 
  - get: B:HANDLING_AILERON_TRIM
    set: (>B:HANDLING_AILERON_TRIM_Set)
  - get: A:ELEVATOR TRIM POSITION
    set: "value > current ? '1 (>K:ELEVATOR_TRIM_INC)' : '1 (>K:ELEVATOR_TRIM_DEC)'"

  - get: B:HANDLING_RUDDER_TRIM
    set: (>B:HANDLING_RUDDER_TRIM_Set)

  - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, position 16k # Throttle 1 LEVER
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:2, position 16k # Throttle 2 LEVER
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:3, position 16k # Throttle 3 LEVER
  - get: A:GENERAL ENG THROTTLE LEVER POSITION:4, position 16k # Throttle 4 LEVER  
  - get: B:ENGINE_1_CONDITION, Percent
    set: |
      switch (value) {
          case   0: return '0 (>B:ENGINE_1_CONDITION_Set)'
          case  100: return '1 (>B:ENGINE_1_CONDITION_Set)'
          default: return ''
      }
  - get: B:ENGINE_4_CONDITION, Percent
    set: |
      switch (value) {
          case   0: return '0 (>B:ENGINE_4_CONDITION_Set)'
          case  100: return '1 (>B:ENGINE_4_CONDITION_Set)'
          default: return ''
      }
  - get: A:BRAKE LEFT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_LEFT_BRAKE_SET)`"
  - get: A:BRAKE RIGHT POSITION EX1, Position 32k
    set: "`${value - 16384} (>K:AXIS_RIGHT_BRAKE_SET)`"
