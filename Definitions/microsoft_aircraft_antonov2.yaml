######### Example #########
  - get: A:FUEL TANK SELECTOR:1, Enum
    set: |
      switch (value) {
        case 0: return '(>K:FUEL_SELECTOR_OFF)'
        case 1: return '(>K:FUEL_SELECTOR_ALL)'        
        case 19: return '(>K:FUEL_SELECTOR_LEFT_MAIN)'
        case 20: return '(>K:FUEL_SELECTOR_RIGHT_MAIN)'
        default: return ''
      }  
  - get: B:INSTRUMENT_AN2_door_cabin_handle
    set: | 
      switch (value) { 
        case 0: return '0 (>B:INSTRUMENT_AN2_door_cabin_handle_Set) 1(A:INTERACTIVE POINT GOAL) '
        case 1: return '1 (>B:INSTRUMENT_AN2_door_cabin_handle_Set) 0(A:INTERACTIVE POINT GOAL) '
        default: return ''
      }  
