  - get: B:SAFETY_SAFETY_PUSH_GPWS_2_KEY            # GPWS 2
    set: "(L:MSATR_TAWS_TERR) ! (>L:MSATR_TAWS_TERR)"
  - get: B:SAFETY_SWITCH_GPWS_1                     # GPWS switch
    set: |
      switch (Math.round(value)) {
          case 0: return '(>B:SAFETY_SWITCH_GPWS_1_0)'
          case 1: return '(>B:SAFETY_SWITCH_GPWS_1_1)'
          case 2: return '(>B:SAFETY_SWITCH_GPWS_1_2)'
          default: return ''
      }
  - get: B:SAFETY_SWITCH_GPWS_1_COVER               # GPWS cover
    set: "`${value} (B:SAFETY_SWITCH_GPWS_1_COVER, Number) != if{ (>B:SAFETY_SWITCH_GPWS_1_COVER_Toggle) }`"
  - get: B:SAFETY_SWITCH_GPWS_2                     # GPWS switch
    set: |
      switch (Math.round(value)) {
          case 0: return '(>B:SAFETY_SWITCH_GPWS_2_0)'
          case 1: return '(>B:SAFETY_SWITCH_GPWS_2_1)'
          case 2: return '(>B:SAFETY_SWITCH_GPWS_2_2)'
          default: return ''
      }
  - get: B:SAFETY_SWITCH_GPWS_2_COVER               # GPWS cover
    set: "`${value} (B:SAFETY_SWITCH_GPWS_2_COVER, Number) != if{ (>B:SAFETY_SWITCH_GPWS_2_COVER_Toggle) }`"
