# Microsoft ATR 42-600 / ATR 72-600 / Freighter / STOL
# Aircraft folder: microsoft_atr
# Updated: 08/06/2026
# Created By: JustGreg
# Version: 0.1.1

include:
  - modules/fuel.yaml
  - modules/payload.yaml

master:
  # ── Flight Controls — analog levers, Pilot Flying only ──────────────────────
  - get: L:MSATR_THR_LEVER1_POS
    set: "`${Math.round(value)} (>L:MSATR_THR_LEVER1_POS)`"
  - get: L:MSATR_THR_LEVER2_POS
    set: "`${Math.round(value)} (>L:MSATR_THR_LEVER2_POS)`"
  - get: A:ELEVATOR TRIM PCT, Percent              # Elevator trim
    set: "`${value * 163.83} (>K:ELEVATOR_TRIM_SET)`"
  - get: A:AILERON TRIM PCT, Percent               # Aileron trim
    set: "`${value * 163.83} (>K:AILERON_TRIM_SET_EX1)`"
  - get: A:RUDDER TRIM PCT, Percent                # Rudder trim
    set: "`${value * 163.83} (>K:RUDDER_TRIM_SET_EX1)`"

shared:
  - get: L:MSATR_CONDITION1_POS
  - get: L:MSATR_CONDITION2_POS
  - get: A:FLAPS HANDLE INDEX, Number
    set: |
      switch(Math.round(value)) {
        case 0: return '(>K:FLAPS_UP)';
        case 1: return '(>K:FLAPS_1)';
        case 2: return '(>K:FLAPS_2)';
        default: return '';
      }
  # ── Autopilot — mode buttons ────────────────────────────────────────────────
# Autopilot — mode buttons
# AP Engage toggle
  - get: A:AUTOPILOT MASTER, Bool
    set: "1 (>L:MSATR_FGCP_AP)"
  - get: L:MSATR_FGCP_STAT_HDG_SEL, Bool                   # HDG mode
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_HEADING_KEY_Set) 0 (>B:AUTOPILOT_AUTOPILOT_PUSH_HEADING_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_HEADING_KEY_Set) 1 (>B:AUTOPILOT_AUTOPILOT_PUSH_HEADING_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_ALT                             # ALT mode
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_ALTITUDE_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_ALTITUDE_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_NAV, Bool                       # NAV mode
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_NAVIGATION_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_NAVIGATION_KEY_Set)'"
  - get: L:MSATR_FGCP_APP                                  # APR mode (momentary pulse)
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_APPROACH_KEY_Set)' : ''"
  - get: L:MSATR_FGCP_STAT_BC                              # Back-course
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_BACKCOURSE_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_BACKCOURSE_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_FD1, Bool                       # FD 1
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_FLIGHTDIRECTOR_1_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_FLIGHTDIRECTOR_1_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_FD2, Bool                       # FD 2
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_FLIGHTDIRECTOR_2_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_FLIGHTDIRECTOR_2_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_IAS                             # Speed mode (IAS)
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_SPEED_KEY_Set) 0 (>B:AUTOPILOT_AUTOPILOT_PUSH_SPEED_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_SPEED_KEY_Set) 1 (>B:AUTOPILOT_AUTOPILOT_PUSH_SPEED_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_VS                              # VS mode
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_VERTICALSPEED_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_VERTICALSPEED_KEY_Set)'"
  - get: L:MSATR_FGCP_STAT_YD                              # Yaw damper
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_YAWDAMPER_KEY_Set)' : '0 (>B:AUTOPILOT_AUTOPILOT_PUSH_YAWDAMPER_KEY_Set)'"
  - get: L:MSATR_FGCP_VNAV                                 # VNAV mode (momentary pulse)
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_VERTICALNAVIGATION_KEY_Set)' : ''"
  - get: L:MSATR_FGCP_STAT_AP                              # AP standby
    set: "value < 0.5 ? '1 (>B:AUTOPILOT_AUTOPILOT_PUSH_STANDBY_KEY_Set)' : ''"

  # ATR-specific modes — no standard SimVar, read from FGCP status L: variables
  - get: L:MSATR_FGCP_STAT_VNAV, Bool                      # VNAV
    set: "value >= 0.5 ? '1 (>L:MSATR_FGCP_VNAV)' : ''"
  - get: L:MSATR_FGCP_CPL_CPT_LT                           # CPL
    set: "value >= 0.5 ? '1 (>L:MSATR_FGCP_CPL)' : ''"
  - get: L:MSATR_FGCP_STAT_MAN_SPD                         # Speed hold
    set: "1 (>B:INSTRUMENT_PUSH_SPD_SEL_1_KEY_Set) 0 (>B:INSTRUMENT_PUSH_SPD_SEL_1_KEY_Set)"
  - get: L:MSATR_FGCP_TGT                                  # Target speed knob 1
    set: "`${Math.round(value)} (>L:MSATR_FGCP_TGT)`"
  # ── Autopilot — selected values ─────────────────────────────────────────────
  - get: L:MSATR_FGCP_SELALT                               # Selected altitude
    set: "`${Math.round(value)} (>L:MSATR_FGCP_SELALT)`"
  - get: A:AUTOPILOT VERTICAL HOLD VAR, Feet per minute    # Selected V/S
    set: "`${Math.round(value)} (>K:AP_VS_VAR_SET_ENGLISH)`"

  # - get: L:MSATR_SEL_HDG                                   # Selected heading
  #   set: "`${Math.round(value)} (>K:HEADING_BUG_SET)`"
  - get: L:MSATR_SEL_HDG                                   # Selected heading
    set: "`${Math.round(value)} (>L:MSATR_SEL_HDG) 1 (>L:MSATR_SEL_HDG_CHANGED)`"
  - get: L:MSATR_SEL_HDG_SYNC                              # HDG sync (momentary)
    set: "value >= 0.5 ? '1 (>B:AUTOPILOT_HEADING_SYNC_Set) 0 (>B:AUTOPILOT_HEADING_SYNC_Set)' : ''"

  - get: L:MSATR_SEL_HDG_CHANGED                           # Fires 1 on heading change
    set: "value >= 0.5 ? '0 (>L:MSATR_SEL_HDG_CHANGED)' : ''"
  - get: A:NAV OBS:1, Degrees                              # CRS 1
    set: "`${Math.round(value)} (>K:VOR1_OBS_SET)`"
  - get: A:NAV OBS:2, Degrees                              # CRS 2
    set: "`${Math.round(value)} (>K:VOR2_OBS_SET)`"
  - get: L:MSATR_SEL_SPD                                   # Speed target (read-only, cannot be set externally)
  - get: L:MSATR_FGCP_WHEEL_VALUE                          # Selected V/S (actual value)
    set: "`${Math.round(value)} (>L:MSATR_FGCP_WHEEL_VALUE)`"

  - get: A:KOHLSMAN SETTING MB:1, Millibars                 # Baro captain
    set: "`${Math.round(value * 16)} (>K:KOHLSMAN_SET)`"

  - get: B:INSTRUMENT_KNOB_BARO_SET_1_PUSH                  # Baro STD push captain
    set: "1 (>L:MSATR_BARO_STD_1)"

  - get: A:KOHLSMAN SETTING MB:2, Millibars                 # Baro F/O
    set: "`${Math.round(value * 16)} (>K:2:KOHLSMAN_SET)`"

  - get: B:INSTRUMENT_KNOB_BARO_SET_2_PUSH                  # Baro STD push F/O
    set: "1 (>L:MSATR_BARO_STD_2)"

  - get: L:MSATR_DH_VALUE_1                                 # DH captain → update F/O
    set: "`${Math.round(value)} (>B:INSTRUMENT_KNOB_DH_MDA_VALUE_2_Set)`"

  - get: L:MSATR_DH_VALUE_2                                 # DH F/O → update captain
    set: "`${Math.round(value)} (>B:INSTRUMENT_KNOB_DH_MDA_VALUE_1_Set)`"
  - get: L:MSATR_DH_TOGGLE_1
    set: "`${Math.round(value)} (>L:MSATR_DH_TOGGLE_1) ${Math.round(value)} (>L:MSATR_DH_TOGGLE_2)`"
  - get: L:MSATR_DH_TOGGLE_2
    set: "`${Math.round(value)} (>L:MSATR_DH_TOGGLE_1) ${Math.round(value)} (>L:MSATR_DH_TOGGLE_2)`"

  # ATR-specific knobs — no SimVar equivalent, keep B:
  - get: L:MSATR_FGCP_SRC1                                 # AP mode knob 1
  - get: L:MSATR_FGCP_SRC2                                 # AP mode knob 2
  - get: B:AUTOPILOT_KNOB_TGT_1                            # Speed/target knob 1
  - get: B:AUTOPILOT_KNOB_TGT_2                            # Speed/target knob 2
  - get: B:AUTOPILOT_CABPRESS_KNOB_MAN_SET                 # Cabin press manual set
  - get: L:MSATR_FGCP_CRS1
  - get: L:MSATR_FGCP_CRS2

  - get: A:COM ACTIVE FREQUENCY:1, Hz
    set: (>K:COM_RADIO_SET_HZ)
  - get: A:COM ACTIVE FREQUENCY:2, Hz
    set: (>K:COM2_RADIO_SET_HZ)
  - get: A:COM ACTIVE FREQUENCY:3, Hz
    set: (>K:COM3_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:1, Hz # doesn't work
    set: (>K:COM_STBY_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:2, Hz # doesn't work
    set: (>K:COM2_STBY_RADIO_SET_HZ)
  - get: A:COM STANDBY FREQUENCY:3, Hz # doesn't work
    set: (>K:COM2_STBY_RADIO_SET_HZ)
  - get: A:TRANSPONDER CODE:1, BCO16 # XPDR Code
    set: (>K:XPNDR_SET)
  - get: A:TRANSPONDER IDENT:1, Bool # Ident
  - get: A:TRANSPONDER STATE:1, Enum # XPDR StandBy/On/Alt

    #DOORS
  - get: A:INTERACTIVE POINT GOAL:0, Bool
    set: "1 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:1, Bool
    set: "2 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:2, Bool
    set: "3 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:3, Bool
    set: "4 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:4, Bool
    set: "5 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:5, Bool
    set: "6 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:6, Bool
    set: "7 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:7, Bool
    set: "8 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:10, Bool
    set: "11 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:11, Bool
    set: "12 (>K:TOGGLE_AIRCRAFT_EXIT)"
  - get: A:INTERACTIVE POINT GOAL:12, Bool
    set: "13 (>K:TOGGLE_AIRCRAFT_EXIT)"

  - get: A:CONTACT POINT STEER ANGLE:0, Radians
    set: (>K:STEERING_SET)

  # ── Engine ──────────────────────────────────────────────────────────────────
  - get: L:MSATR_ENGS_MODE                          # Engine start selector knob (0=OFF, 1=CRANK, 2=START_A, 3=START_B, 4=START_AB)
    set: |
      switch (Math.round(value)) {
          case 0: return '(>B:ENGINE_ENGINE_KNOB_STARTER_STATE_0)'
          case 1: return '(>B:ENGINE_ENGINE_KNOB_STARTER_STATE_1)'
          case 2: return '(>B:ENGINE_ENGINE_KNOB_STARTER_STATE_2)'
          case 3: return '(>B:ENGINE_ENGINE_KNOB_STARTER_STATE_3)'
          case 4: return '(>B:ENGINE_ENGINE_KNOB_STARTER_STATE_4)'
          default: return ''
      }
  - get: L:MSATR_ENG_PWRMGT_1          # Power mgmt inner knob
  - get: L:MSATR_ENG_PWRMGT_2          # Power mgmt outer knob
  - get: B:ENGINE_ENGINE_KNOB_PWRMGT_TOGGLE         # Power mgmt push
  - get: B:ENGINE_ENGINE_PUSH_IGNITION              # Ignition push
    set: "(L:MSATR_ENGS_IGN) ! (>L:MSATR_ENGS_IGN)"
  - get: B:ENGINE_ENGINE_PUSH_IGNITION_COVER        # Ignition cover
  - get: L:MSATR_ENGS_START1                        # Start engine 1 (long-press=1, release=0)
    set: "value >= 0.5 ? '1 1 (>B:ENGINE_ENGINE_PUSH_STARTER_1_KEY_PUSH_LONG)' : '0 (>B:ENGINE_ENGINE_PUSH_STARTER_1_KEY_RELEASE)'"
  - get: L:MSATR_ENGS_START2                        # Start engine 2 (long-press=1, release=0)
    set: "value >= 0.5 ? '1 1 (>B:ENGINE_ENGINE_PUSH_STARTER_2_KEY_PUSH_LONG)' : '0 (>B:ENGINE_ENGINE_PUSH_STARTER_2_KEY_RELEASE)'"
  - get: B:ENGINE_ENGINE_LEVER_THROTTLE_1_PUSH_GOAROUND_KEY  # TOGA 1
    set: "1 (>L:MSATR_ENG_GA1)"
  - get: B:ENGINE_ENGINE_LEVER_THROTTLE_2_PUSH_GOAROUND_KEY  # TOGA 2
    set: "1 (>L:MSATR_ENG_GA2)"
  - get: B:ENGINE_KNOB_ATPCS_TEST                   # ATPCS test knob
    set: |
      switch (Math.round(value)) {
          case 0: return '(>B:ENGINE_KNOB_ATPCS_TEST_STATE_0)'
          case 1: return '(>B:ENGINE_KNOB_ATPCS_TEST_STATE_1)'
          case 2: return '(>B:ENGINE_KNOB_ATPCS_TEST_STATE_2)'
          case 3: return '(>B:ENGINE_KNOB_ATPCS_TEST_STATE_3)'
          case 4: return '(>B:ENGINE_KNOB_ATPCS_TEST_STATE_4)'
          default: return ''
      }
  - get: B:ENGINE_PUSH_APM                          # APM push
    set: "(L:MSATR_ENG_APM) ! (>L:MSATR_ENG_APM)"
  - get: L:MSATR_ATPCS                              # ATPCS button
  - get: B:ENGINE_PUSH_BOOST                        # Boost push
    set: "(L:MSATR_ENG_BOOST) ! (>L:MSATR_ENG_BOOST)"
  - get: B:ENGINE_PUSH_EEC1                         # EEC 1
    set: "(L:MSATR_ENG_EEC1) ! (>L:MSATR_ENG_EEC1)"
  - get: B:ENGINE_PUSH_EEC2                         # EEC 2
    set: "(L:MSATR_ENG_EEC2) ! (>L:MSATR_ENG_EEC2)"
  - get: B:ENGINE_PUSH_PEC1                         # PEC 1
    set: "(L:MSATR_ENG_PEC1) ! (>L:MSATR_ENG_PEC1)"
  - get: B:ENGINE_PUSH_PEC2                         # PEC 2
    set: "(L:MSATR_ENG_PEC2) ! (>L:MSATR_ENG_PEC2)"
  - get: L:MSATR_ENG_APM_TEST                       # APM test
  - get: B:ENGINE_PUSH_PEDESTAL_BACK_ATPCS_TEST     # ATPCS test (pedestal)
    set: "`${value} (B:ENGINE_PUSH_PEDESTAL_BACK_ATPCS_TEST, Number) != if{ (>B:ENGINE_PUSH_PEDESTAL_BACK_ATPCS_TEST_Toggle) }`"
  - get: B:ENGINE_SWITCH_PROP_BRAKE                 # Prop brake switch
    set: "(L:MSATR_ENGS_PROP_BRK) ! (>L:MSATR_ENGS_PROP_BRK)"
  - get: B:ENGINE_SWITCH_PROP_BRAKE_LOCK            # Prop brake cover/lock
    set: "`${value} (B:ENGINE_SWITCH_PROP_BRAKE_LOCK, Number) != if{ (>B:ENGINE_SWITCH_PROP_BRAKE_LOCK_Toggle) }`"

  # Trim
  - get: 

  # ── Fuel ────────────────────────────────────────────────────────────────────
  - get: L:MSATR_FUEL_XFEED
  - get: L:MSATR_FUEL_PUMP1
  - get: L:MSATR_FUEL_PUMP2

  # ── Handling / Ground Controls ───────────────────────────────────────────────
  - get: B:HANDLING_HANDLING_LEVER_GUSTLOCK         # Gust lock lever
    set: "value >= 0.5 ? '(>B:HANDLING_HANDLING_LEVER_GUSTLOCK_ON)' : '(>B:HANDLING_HANDLING_LEVER_GUSTLOCK_OFF)'"
  - get: B:HANDLING_HANDLING_YOKE_L_SWITCH_ELEVATORTRIM  # Capt trim switch
  - get: B:HANDLING_HANDLING_YOKE_R_SWITCH_ELEVATORTRIM  # F/O trim switch
  - get: B:HANDLING_LEVER_IDLE_GATE                 # Idle gate lever
    set: "(L:MSATR_ENG_IDLE_GATE) ! (>L:MSATR_ENG_IDLE_GATE)"
  - get: B:HANDLING_RUDDERTRIM_RESET                # Rudder trim reset button
  - get: B:HANDLING_SWITCH_FLT_CTL                  # Flight control switch (0=High, 1=Auto, 2=Low)
    set: |
      switch (Math.round(value)) {
          case 0: return '(>B:HANDLING_SWITCH_FLT_CTL_0)'
          case 1: return '(>B:HANDLING_SWITCH_FLT_CTL_1)'
          case 2: return '(>B:HANDLING_SWITCH_FLT_CTL_2)'
          default: return ''
      }
  - get: L:MSATR_SWITCH_FLT_CTL_COVER              # Flight control cover state
  - get: B:HANDLING_Switch_FLT_CTL_cover            # Flight control cover
    set: "`${value} (B:HANDLING_Switch_FLT_CTL_cover, Number) != if{ (>B:HANDLING_Switch_FLT_CTL_cover_Toggle) }`"
    skp: B:HANDLING_Switch_FLT_CTL_cover
  - get: B:HANDLING_SWITCH_NW_STEERING              # Nose wheel steering
    set: "(L:MSATR_NW_STEERING) ! (>L:MSATR_NW_STEERING)"
  - get: B:HANDLING_SWITCH_NW_STEERING_COVER        # NW steering cover
    set: "`${value} (B:HANDLING_SWITCH_NW_STEERING_COVER, Number) != if{ (>B:HANDLING_SWITCH_NW_STEERING_COVER_Toggle) }`"
  - get: L:MSATR_PARK_EMER_BRK

  # ── Landing Gear ─────────────────────────────────────────────────────────────
  - get: A:GEAR HANDLE POSITION, Bool               # Gear lever (1=up, 0=down)
    set: "value >= 0.5 ? '(>K:GEAR_DOWN)' : '(>K:GEAR_UP)'"
    skp: B:LANDING_GEAR_GEAR  
  - get: B:LANDING_GEAR_LANDING_GEAR_PUSH_ANTISKID            # Anti-skid
    set: "(L:MSATR_GEAR_ASKID) ! (>L:MSATR_GEAR_ASKID)"
  - get: L:MSATR_GEAR_ASKID_TEST                        # Anti-skid test

  # ── Electrical ──────────────────────────────────────────────────────────────
  - get: L:MSATR_ELEC_BAT_SWITCH
  - get: B:ELECTRICAL_SWITCH_BATTERY_MASTER_LOCK              # Battery cover
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_BATTERYSELECTOR       # Battery selector
    set: "(L:MSATR_ELEC_BAT_SEL) ! (>L:MSATR_ELEC_BAT_SEL)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_ACW_BTC                 # ACW BTC
    set: "(L:MSATR_ACWF_BTC) ! (>L:MSATR_ACWF_BTC)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_ACW_BTC_COVER           # ACW BTC cover
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_ACW_EXT_PWR             # External power
    set: "(L:MSATR_ACWF_EXTPWR) ! (>L:MSATR_ACWF_EXTPWR)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_ACW_GEN1                # Generator 1
    set: "(L:MSATR_ACWF_GEN1) ! (>L:MSATR_ACWF_GEN1)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_ACW_GEN2                # Generator 2
    set: "(L:MSATR_ACWF_GEN2) ! (>L:MSATR_ACWF_GEN2)"
  - get: L:MSATR_ELEC_EMER_BAT_CHRG
  - get: L:MSATR_ELEC_MAIN_BAT_CHRG
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_DCSVCE                  # DC service
    set: "(L:MSATR_ELEC_DC_SVC_UTIL_BUS) ! (>L:MSATR_ELEC_DC_SVC_UTIL_BUS)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_STBY_BUS               # Standby bus
    set: "(L:MSATR_ELEC_STBY_BUS) ! (>L:MSATR_ELEC_STBY_BUS)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_STBY_BUS_COVER         # Standby bus cover
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_TRU                     # TRU
    set: "(L:MSATR_ELEC_TRU) ! (>L:MSATR_ELEC_TRU)"
  - get: B:ELECTRICAL_ELECTRICAL_PUSH_TRU_COVER              # TRU cover
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_BTC                   # BTC switch
    set: "(L:MSATR_ELEC_BTC) ! (>L:MSATR_ELEC_BTC)"
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_BTC_COVER            # BTC cover
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_DC_1                  # DC bus 1
    set: "(L:MSATR_ELEC_DCGEN1) ! (>L:MSATR_ELEC_DCGEN1)"
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_DC_2                  # DC bus 2
    set: "(L:MSATR_ELEC_DCGEN2) ! (>L:MSATR_ELEC_DCGEN2)"
  - get: B:ELECTRICAL_ELECTRICAL_SWITCH_EXTERNALPOWER        # Ext power switch
    set: "(L:MSATR_ELEC_DC_EXTPWR) ! (>L:MSATR_ELEC_DC_EXTPWR)"
  - get: L:MSATR_FCTL_MFC_1A
  - get: L:MSATR_FCTL_MFC_1B
  - get: L:MSATR_FCTL_MFC_2A
  - get: L:MSATR_FCTL_MFC_2B
  - get: B:ELECTRICAL_SWITCH_DATABUS                          # Data bus switch
  - get: B:ELECTRICAL_SWITCH_DATABUS_LOCK                     # Data bus cover
  - get: B:ELECTRICAL_SWITCH_ELEC_BTC                        # Elec BTC
  - get: B:ELECTRICAL_SWITCH_ELEC_BTC_LOCK                   # Elec BTC cover
  - get: B:ELECTRICAL_SWITCH_ENG_SELECT                       # Engine select
  - get: B:ELECTRICAL_SWITCH_ENG_SELECT_LOCK                  # Engine select cover
  - get: B:ELECTRICAL_SWITCH_ENG1_PLA                        # ENG 1 PLA switch
  - get: B:ELECTRICAL_SWITCH_ENG1_PLA_LOCK                   # ENG 1 PLA cover
  - get: B:ELECTRICAL_SWITCH_ENG1_TRIM_LRU                   # ENG 1 trim LRU
  - get: B:ELECTRICAL_SWITCH_ENG1_TRIM_LRU_LOCK              # ENG 1 trim cover
  - get: B:ELECTRICAL_SWITCH_ENG2_PLA                        # ENG 2 PLA switch
  - get: B:ELECTRICAL_SWITCH_ENG2_PLA_LOCK                   # ENG 2 PLA cover
  - get: B:ELECTRICAL_SWITCH_ENG2_TRIM_LRU                   # ENG 2 trim LRU
  - get: B:ELECTRICAL_SWITCH_ENG2_TRIM_LRU_LOCK              # ENG 2 trim cover
  - get: B:ELECTRICAL_SWITCH_PROP_FEATH_PUMP                 # Prop feathering pump
  - get: B:ELECTRICAL_SWITCH_PROP_FEATH_PUMP_LOCK            # Prop feathering cover
