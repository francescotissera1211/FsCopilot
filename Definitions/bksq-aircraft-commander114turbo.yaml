# Known Issues:
  # - Initial release all functions working. 
  # - 8/16/2026
   # - Pitch Trim Switch is not Synched
   # GPS/VLOC on GPS units or from Panel are not synched. Each pilot must switch from GPS/VLOC manually. 
   # GTN750/650 are getting strange double entries on entering ICAO and WAYPOINTS via touch keyboard. Import flight plan from Simbrief or enter manually. 
   # FLAP Switch due to its functionality acts strange. The flaps move, but the second pilot's seems to not increase/decrease at the same rate as the pilot making the flap changes when using the flap lever in SIM. I have it mapped to a switch using the FLAPS_INCR and FLAPS_DECR and it seems to work fine. ## Please let me know as I think this may need to be removed from synch.## 

# FIXED:
  # - 8/16/2026
   # - Initial releases. Please report issues other than those identified above.
   # - ADDED TURBO MIXTURE CONTROLLER
   # - ADDED Control Locks

