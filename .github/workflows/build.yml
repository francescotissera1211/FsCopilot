name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Accept v1.2.3, v1.2.3-beta.1 and the v.1.2.3 typo.
            version="${GITHUB_REF#refs/tags/v}"
            version="${version#.}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '${GITHUB_REF#refs/tags/}' is not a version. Use v1.2.3 or v1.2.3-beta.1"
              exit 1
            fi
          else
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' FsCopilot/FsCopilot.csproj)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Publish app
        shell: bash
        run: dotnet publish FsCopilot/FsCopilot.csproj -c Release -r win-x64 -o publish -p:Version=${{ steps.version.outputs.version }}

      # The bridge package needs the MSFS SDK only for its WASM module, which this fork does not change.
      # Take the prebuilt package from upstream and overlay this repo's bridge HTML/JS on top of it.
      - name: Build bridge package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' FsCopilot/FsCopilot.csproj)
          mkdir -p upstream
          gh release download "v$upstream_version" --repo yury-sch/FsCopilot --pattern '*.zip' --dir upstream \
            || gh release download "$upstream_version" --repo yury-sch/FsCopilot --pattern '*.zip' --dir upstream
          for z in upstream/*.zip; do unzip -q -o "$z" -d upstream/extracted; done
          bridge=$(find upstream/extracted -type d -name fscopilot-bridge | head -n 1)
          if [ -z "$bridge" ]; then
            echo "::error::Bridge package not found in upstream release v$upstream_version"
            exit 1
          fi
          mkdir -p publish/Community
          cp -r "$bridge" publish/Community/
          python .github/scripts/overlay_bridge.py publish/Community/fscopilot-bridge FsCopilot.Bridge/PackageSources/HTML_UI

      # The app refuses a bridge whose WASM reports a different version, so check the bundled one here.
      - name: Check bridge WASM version
        shell: bash
        run: |
          expected=$(sed -n 's:.*WasmVersion = "\(.*\)";.*:\1:p' FsCopilot/Connection/SimClient.cs)
          python - "$expected" <<'PY'
          import pathlib, re, sys
          expected = sys.argv[1]
          wasm = list(pathlib.Path("publish/Community/fscopilot-bridge").rglob("*.wasm"))
          if not wasm:
              sys.exit("::error::No .wasm module in the bundled bridge")
          for w in wasm:
              data = w.read_bytes()
              # Strings in a WASM data segment are NUL-terminated but may follow any byte.
              found = sorted({m.decode() for m in re.findall(rb"(?<![0-9.])(\d+\.\d+(?:\.\d+)?(?:-rc\d*)?)\x00", data)})
              print(f"{w} ({len(data)} bytes): version-like strings {found}, app expects {expected}")
              for m in re.finditer(re.escape(expected.encode()), data):
                  print(f"  '{expected}' at {m.start()}: {data[max(0, m.start() - 24):m.end() + 8]!r}")
              if expected not in found:
                  sys.exit(f"::error::Bundled bridge {w.name} reports {found}, but the app expects {expected} (SimClient.WasmVersion). The app would show a version mismatch.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: FsCopilot-win-x64
          path: publish/
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          zip="FsCopilot-$tag-win-x64.zip"
          (cd publish && 7z a -tzip "../$zip" . > /dev/null)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Release was created on GitHub (which also pushed the tag): just attach the build.
            gh release upload "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Versions with a suffix (-beta.1) are pre-releases; the app's update check ignores those.
            prerelease=""
            [[ "${{ steps.version.outputs.version }}" == *-* ]] && prerelease="--prerelease"
            gh release create "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes $prerelease
          fi
